<!doctype html><html lang="pt-BR" data-cat="estudos"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Laboratório Virtual de Genética — Zcode</title><meta name="description" content="Cruamentos."><style>@import url('https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=DM+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400&display=swap');:root{--bg:#075649;--surface:#0d4f42;--text:#ecfdf5;--accent:#34d399;--line:rgba(52,211,153,.2);}*{box-sizing:border-box;margin:0;padding:0;font-family:'Inter',system-ui,sans-serif;}body{background:#075649;color:var(--text);min-height:100dvh;display:flex;flex-direction:column;align-items:center;padding:40px 20px;}h1{font-family:'Space Grotesk',Georgia,serif;font-size:2rem;letter-spacing:-.03em;text-align:center;margin-bottom:6px;color:#ecfdf5;}.subtitle{text-align:center;color:#86efac;margin-bottom:24px;font-size:1rem;}.exp{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:28px;width:100%;max-width:640px;box-shadow:0 20px 60px rgba(0,0,0,.3);}.stage{min-height:200px;background:#064e3f;border-radius:12px;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-family:'Space Grotesk',Georgia,serif;font-size:1.4rem;color:#86efac;}button{margin-top:14px;padding:10px 20px;background:var(--surface);border:none;border-radius:10px;color:#064e3f;font-weight:700;cursor:pointer;}.desc{margin-top:12px;color:#86efac;font-size:.85rem;line-height:1.5;}</style></head><body><h1>Laboratório Virtual de Genética</h1><p class="subtitle">Cruamentos.</p><div class="exp"><div class="stage" id="stage">Experimento iniciado — Ajuste variáveis.</div><button onclick="document.getElementById('stage').textContent='Resultado observado: alteração visível.'">Executar experimento</button></div><div class="desc">Ajuste variáveis.</div></body></html>
