<!doctype html><html lang="pt-BR" data-cat="uteis"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Calculadora de Peso Ideal — Zcode</title><meta name="description" content="Faixas recomendadas."><style>@import url('https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=DM+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400&display=swap');:root{--bg:#0f172a;--surface:#1e293b;--text:#f8fafc;--muted:#94a3b8;--accent:#38bdf8;--line:rgba(148,163,184,.2);}*{box-sizing:border-box;margin:0;padding:0;font-family:'Inter',system-ui,sans-serif;}body{background:var(--bg);color:var(--text);min-height:100dvh;display:flex;flex-direction:column;align-items:center;padding:48px 20px;}h1{font-family:'Space Grotesk',Georgia,serif;font-size:2.4rem;letter-spacing:-.03em;text-align:center;margin-bottom:8px;}.subtitle{font-size:1rem;color:var(--muted);text-align:center;margin-bottom:28px;}.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:28px 32px;max-width:560px;width:100%;box-shadow:0 20px 60px rgba(0,0,0,.3);}label{display:block;font-family:'JetBrains Mono',monospace;font-size:.7rem;text-transform:uppercase;letter-spacing:.1em;color:var(--accent);margin-bottom:6px;}input{width:100%;padding:12px 14px;background:#0f172a;border:1px solid var(--line);border-radius:10px;color:var(--text);font-family:'JetBrains Mono',monospace;font-size:1.1rem;margin-bottom:14px;}button{width:100%;padding:14px;background:var(--surface);border:none;border-radius:10px;color:#0f172a;font-weight:700;font-size:1rem;cursor:pointer;}.result{margin-top:16px;padding:14px;background:rgba(56,189,248,.1);border-left:3px solid var(--accent);border-radius:8px;font-family:'Space Grotesk',Georgia,serif;font-size:1.4rem;}.desc{margin-top:10px;color:var(--muted);font-size:.85rem;line-height:1.5;}</style></head><body><h1>Calculadora de Peso Ideal</h1><p class="subtitle">Faixas recomendadas.</p><div class="card"><label>Entrada — Valor</label><input id="in" type="number" step="any" placeholder="Informe o valor..." value="10"><button onclick="calcular()">Calcular</button><div id="res" class="result">Resultado aparecerá aqui.</div><div class="desc">v*1.2</div></div><script>function calcular(){const v=parseFloat(document.getElementById('in').value)||0;document.getElementById('res').textContent="Resultado: "+(v*v*1.2).toFixed(3);}</script></body></html>
