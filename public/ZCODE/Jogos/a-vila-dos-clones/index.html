<!doctype html>
<html lang="pt-BR" data-cat="jogos">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>A Vila dos Clones — Zcode</title>
<meta name="description" content="Descubra quem é original em uma comunidade duplicada.">
<meta name="theme-color" content="#f3f0ea">
<meta name="application-name" content="Zcode">
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D'http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg'%20viewBox%3D'0%200%2064%2064'%3E%3Crect%20width%3D'64'%20height%3D'64'%20fill%3D'%23f3f0ea'%2F%3E%3Cpath%20d%3D'M20%2018h24L20%2046h24'%20fill%3D'none'%20stroke%3D'%23252422'%20stroke-width%3D'7'%20stroke-linecap%3D'square'%2F%3E%3C%2Fsvg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=DM+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --z-bg:#f3f0ea; --z-bg2:#fbfaf7; --z-surface:#fffefa; --z-surface2:#e9e4dc;
  --z-line:rgba(37,36,34,.16); --z-line2:rgba(37,36,34,.3);
  --z-text:#252422; --z-muted:#746e66;
  --z-brand:#873f32; --z-brand-soft:rgba(135,63,50,.12);
  --z-cyan:#64716f; --z-pink:#9f5140; --z-lime:#8b8b64; --z-amber:#b88b4a;
  --z-red:#9f5140; --z-radius:4px;
  --z-fd:"DM Serif Display",Georgia,serif;
  --z-f:"DM Sans",system-ui,sans-serif;
  --z-fm:"IBM Plex Mono",ui-monospace,monospace;
  --z-acc:var(--z-brand);
}
html[data-cat="estudos"]{--z-acc:var(--z-cyan)}
html[data-cat="jogos"]{--z-acc:var(--z-pink)}
html[data-cat="uteis"]{--z-acc:var(--z-lime)}
html[data-cat="social"]{--z-acc:var(--z-amber)}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{
  background:var(--z-bg);
  color:var(--z-text); font-family:var(--z-f); font-size:15px; line-height:1.55;
  min-height:100dvh; -webkit-font-smoothing:antialiased;
}
::selection{background:var(--z-acc);color:#04060d}
a{color:var(--z-acc)}
h1,h2,h3,.fd{font-family:var(--z-fd);letter-spacing:-.02em}
.mono{font-family:var(--z-fm)}
.dim{color:var(--z-muted)} .acc{color:var(--z-acc)}
.center{text-align:center} .row{display:flex;gap:10px;align-items:center}
.wrap{flex-wrap:wrap} .between{justify-content:space-between}
.col{display:flex;flex-direction:column;gap:10px}
.mt{margin-top:14px} .mb{margin-bottom:14px} .grow{flex:1}
.hidden{display:none!important}

/* ── topo ─────────────────────────────────────────────── */
.ztop{
  position:sticky;top:0;z-index:50;display:flex;align-items:center;gap:12px;
  height:54px;padding:0 16px;border-bottom:1px solid var(--z-line);
  background:rgba(243,240,234,.96);backdrop-filter:blur(8px);
}
.ztop-brand{color:var(--z-text);font-family:var(--z-fd);font-size:21px;line-height:1;text-decoration:none;letter-spacing:-.04em;flex:none}
.ztop-mid{min-width:0}
.ztop-mid strong{display:block;font-family:var(--z-fd);font-size:14.5px;letter-spacing:-.01em;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.zchip{display:inline-flex;align-items:center;gap:6px;font-family:var(--z-fm);font-size:10px;
  letter-spacing:.14em;text-transform:uppercase;color:var(--z-acc);
  background:color-mix(in srgb,var(--z-acc) 12%, transparent);
  border:1px solid color-mix(in srgb,var(--z-acc) 34%, transparent);
  padding:2px 9px;border-radius:var(--z-radius);white-space:nowrap}
.zback{margin-left:auto;font-family:var(--z-fm);font-size:11.5px;text-decoration:none;
  color:var(--z-muted);border:1px solid var(--z-line2);border-radius:var(--z-radius);padding:7px 13px;
  transition:.2s;white-space:nowrap}
.zback:hover{color:var(--z-text);border-color:var(--z-acc)}

/* ── layout ───────────────────────────────────────────── */
.zmain{max-width:980px;margin:0 auto;padding:26px 16px 70px}
.zhero{margin-bottom:22px}
.zhero h1{font-size:clamp(26px,4.5vw,40px);font-weight:700;line-height:1.05}
.zhero h1 em{font-style:normal;color:var(--z-acc)}
.zhero p{color:var(--z-muted);margin-top:8px;max-width:640px}
.zfoot{border-top:1px solid var(--z-line);padding:18px 16px 26px;text-align:center;
  font-family:var(--z-fm);font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--z-muted)}
.zfoot b{color:var(--z-text);font-weight:600}

/* ── cartões / painéis ────────────────────────────────── */
.zcard{background:var(--z-surface);border:1px solid var(--z-line);
  border-radius:var(--z-radius);padding:18px}
.zcard.pad{padding:24px}
.zgrid{display:grid;gap:12px}
.zg2{grid-template-columns:repeat(2,1fr)}
.zg3{grid-template-columns:repeat(3,1fr)}
.zg4{grid-template-columns:repeat(4,1fr)}
.zbig{font-family:var(--z-fd);font-size:clamp(40px,9vw,72px);font-weight:700;line-height:1;
  font-variant-numeric:tabular-nums}
.zstat{display:flex;flex-direction:column;gap:2px}
.zstat span{font-family:var(--z-fm);font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--z-muted)}
.zstat b{font-family:var(--z-fd);font-size:20px;font-weight:700}

/* ── botões / campos ──────────────────────────────────── */
.zbtn{display:inline-flex;align-items:center;justify-content:center;gap:8px;cursor:pointer;
  font-family:var(--z-fd);font-weight:600;font-size:14.5px;letter-spacing:-.01em;
  color:#04060d;background:var(--z-acc);border:1px solid transparent;border-radius:var(--z-radius);
  padding:11px 20px;transition:.18s;text-decoration:none;user-select:none}
.zbtn:hover{filter:brightness(1.12);transform:translateY(-1px)}
.zbtn:active{transform:translateY(0)}
.zbtn:disabled{opacity:.45;cursor:not-allowed;transform:none;filter:none}
.zbtn.ghost{background:transparent;color:var(--z-text);border-color:var(--z-line2)}
.zbtn.ghost:hover{border-color:var(--z-acc);color:var(--z-acc)}
.zbtn.danger{background:var(--z-red);color:#fff}
.zbtn.sm{padding:7px 13px;font-size:12.5px;border-radius:10px}
.zbtn.big{padding:14px 28px;font-size:16px;border-radius:15px}
.zbtn.w{width:100%}
.zinput,.zselect,.ztextarea{width:100%;background:var(--z-surface2);border:1px solid var(--z-line2);
  color:var(--z-text);border-radius:var(--z-radius);padding:11px 14px;font-family:var(--z-f);font-size:15px;
  outline:none;transition:.18s}
.zinput:focus,.zselect:focus,.ztextarea:focus{border-color:var(--z-acc);box-shadow:0 0 0 3px color-mix(in srgb,var(--z-acc) 22%,transparent)}
.ztextarea{min-height:130px;resize:vertical;font-family:var(--z-fm);font-size:13px;line-height:1.5}
.zselect{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--z-muted) 50%),linear-gradient(135deg,var(--z-muted) 50%,transparent 50%);
  background-position:calc(100% - 18px) 55%,calc(100% - 13px) 55%;background-size:5px 5px;background-repeat:no-repeat;padding-right:38px}
.zlabel{display:block;font-family:var(--z-fm);font-size:10.5px;letter-spacing:.16em;
  text-transform:uppercase;color:var(--z-muted);margin-bottom:6px}

/* ── opções (quiz) ────────────────────────────────────── */
.zopty{display:flex;align-items:center;gap:12px;width:100%;text-align:left;cursor:pointer;
  background:var(--z-surface2);color:var(--z-text);border:1px solid var(--z-line2);
  border-radius:var(--z-radius);padding:13px 16px;font-family:var(--z-f);font-size:15px;transition:.16s}
.zopty:hover:not(:disabled){border-color:var(--z-acc);transform:translateX(3px)}
.zopty i{font-style:normal;font-family:var(--z-fm);font-size:11px;color:var(--z-muted);
  width:24px;height:24px;border-radius:8px;display:grid;place-items:center;
  background:rgba(148,158,210,.1);flex:none}
.zopty.ok{border-color:var(--z-lime);background:color-mix(in srgb,var(--z-lime) 14%, var(--z-surface2));color:var(--z-lime)}
.zopty.err{border-color:var(--z-red);background:color-mix(in srgb,var(--z-red) 14%, var(--z-surface2));color:var(--z-red)}
.zopty:disabled{cursor:default}

/* ── barra / progresso / toast / modal ────────────────── */
.zprog{height:8px;border-radius:var(--z-radius);background:var(--z-surface2);overflow:hidden}
.zprog i{display:block;height:100%;border-radius:99px;background:var(--z-acc);transition:width .3s}
.ztoast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,16px);z-index:99;
  background:var(--z-text);color:#04060d;font-weight:600;font-size:13.5px;padding:10px 20px;
  border-radius:var(--z-radius);opacity:0;pointer-events:none;transition:.25s;box-shadow:0 14px 34px -10px rgba(0,0,0,.6)}
.ztoast.on{opacity:1;transform:translate(-50%,0)}
.zmodal{position:fixed;inset:0;z-index:80;display:grid;place-items:center;padding:20px;
  background:rgba(3,4,10,.72);backdrop-filter:blur(6px)}
.zbox{width:min(460px,100%);background:var(--z-surface);border:1px solid var(--z-line2);
  border-radius:var(--z-radius);padding:26px;text-align:center}
.zbox h3{font-size:24px;margin-bottom:8px}
.zbox p{color:var(--z-muted);margin-bottom:18px}
.zkbd{font-family:var(--z-fm);font-size:11px;border:1px solid var(--z-line2);border-bottom-width:2px;
  border-radius:7px;padding:2px 7px;background:var(--z-surface2)}
canvas.zc{display:block;width:100%;border-radius:16px;border:1px solid var(--z-line);
  background:var(--z-bg2);touch-action:none}
@media (max-width:560px){
  .zg3,.zg4{grid-template-columns:repeat(2,1fr)}
  .zmain{padding-top:18px}
}
@media (prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important}
}


.zpad{display:grid;grid-template-columns:repeat(3,58px);grid-template-rows:repeat(2,52px);gap:8px;justify-content:center;margin-top:14px}
.zpad button{font-size:19px;background:var(--z-surface2);border:1px solid var(--z-line2);border-radius:10px;
  color:var(--z-text);cursor:pointer;touch-action:none;user-select:none}
.zpad button:active{background:var(--z-acc);color:#fff}
.zpad .sp{visibility:hidden}
.zhelp{margin-top:12px;font-size:12.5px;color:var(--z-muted);line-height:1.5}
.zboard{display:grid;gap:9px;margin:0 auto;max-width:520px}
.zcell{aspect-ratio:1/1;display:grid;place-items:center;font-size:26px;cursor:pointer;user-select:none;
  background:var(--z-surface2);border:1px solid var(--z-line2);border-radius:10px;transition:.12s;padding:0}
.zcell:hover{border-color:var(--z-acc)}
.zcell.on{background:var(--z-acc);color:#fff;border-color:transparent}
.zcell.flip{background:var(--z-surface);border-color:var(--z-acc)}
.zcell.done{opacity:.35;cursor:default}
.zcell.sel{outline:3px solid var(--z-acc);outline-offset:-3px}
.zlist{display:flex;flex-direction:column;gap:8px;max-height:190px;overflow:auto;font-size:13.5px}
.zlist p{border-bottom:1px dashed var(--z-line);padding-bottom:5px}
.ztag{display:inline-block;font-family:var(--z-fm);font-size:11px;padding:3px 9px;border-radius:99px;
  border:1px solid var(--z-line2);color:var(--z-muted)}
.zbars{display:flex;flex-direction:column;gap:10px}
.zbars div{display:flex;align-items:center;gap:10px;font-size:13.5px}
.zbars i{font-style:normal;width:118px;color:var(--z-muted);font-family:var(--z-fm);font-size:11px;
  letter-spacing:.1em;text-transform:uppercase}
.zbars b{margin-left:auto;font-family:var(--z-fd);font-size:16px}
.zshop{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px}
.zshop button{text-align:left;padding:12px 14px;border-radius:10px;background:var(--z-surface2);
  border:1px solid var(--z-line2);color:var(--z-text);cursor:pointer;font-family:var(--z-f);font-size:13.5px}
.zshop button:hover:not(:disabled){border-color:var(--z-acc)}
.zshop button:disabled{opacity:.45;cursor:not-allowed}
.zshop b{display:block;font-family:var(--z-fd);font-size:15px;margin-bottom:2px}
.zlanes{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;max-width:420px;margin:10px auto 0}
.zlanes button{padding:12px 0;font-family:var(--z-fd);font-size:16px;background:var(--z-surface2);
  border:1px solid var(--z-line2);border-radius:10px;color:var(--z-text);cursor:pointer}
.zlanes button:active{background:var(--z-acc);color:#fff}
.zbins{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:520px;margin:12px auto 0}
.zbins button{padding:14px 8px;border-radius:10px;background:var(--z-surface2);border:1px solid var(--z-line2);
  color:var(--z-text);cursor:pointer;font-size:13px;font-family:var(--z-f)}
.zbins button b{display:block;font-size:24px}
.zsus{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-top:12px}
.zsus button{padding:12px;border-radius:10px;background:var(--z-surface2);border:1px solid var(--z-line2);
  color:var(--z-text);cursor:pointer;text-align:left;font-size:12.5px;line-height:1.5}
.zsus button b{display:block;font-family:var(--z-fd);font-size:15px;margin-bottom:3px}
.zsus button:hover{border-color:var(--z-acc)}
</style>
</head>
<body data-app="a-vila-dos-clones">
<header class="ztop">
  <a class="ztop-brand" href="/" aria-label="Zcode">Zcode</a>
  <div class="ztop-mid">
    <strong>A Vila dos Clones</strong>
  </div>
  <span class="zchip">Jogos</span>
  
    <button id="zmute" class="zback" type="button" title="Som" style="margin-left:0">Som ligado</button>
  <a class="zback" href="/">← Zcode</a>
</header>
<main class="zmain" id="zmain">
<div class="zhero">
  <h1>A Vila dos Clones</h1>
  <p>Descubra quem é original em uma comunidade duplicada.</p>
</div>
<div class="zcard pad">
  <div class="row between wrap mb" style="gap:14px">
    <span class="zstat"><span>Pontos</span><b id="gPts">0</b></span>
    <span class="zstat"><span>Onda</span><b id="gOnda">1</b></span>
    <span class="zstat"><span>Escudo</span><b id="gVid">3</b></span>
    <span class="zstat"><span>Recorde</span><b id="gRec">0</b></span>
    <button class="zbtn" id="gStart" type="button">▶ Começar</button>
  </div>
  <canvas class="zc" id="cv" width="820" height="440"></canvas>
  <div class="zpad" id="zpad" aria-label="Controles">
  <button class="sp" tabindex="-1"></button>
  <button data-k="ArrowUp" aria-label="Cima">▲</button>
  <button class="sp" tabindex="-1"></button>
  <button data-k="ArrowLeft" aria-label="Esquerda">◀</button>
  <button data-k="ArrowDown" aria-label="Baixo">▼</button>
  <button data-k="ArrowRight" aria-label="Direita">▶</button>
</div>
  <p class="zhelp">← → movem, <span class="zkbd">espaço</span> (ou ▲ no direcional) dispara. Não deixe 🌀 alcançar a base.</p>
</div>
</main>
<footer class="zfoot"><b>Zcode</b> · plataforma de aplicativos · Jogos</footer>
<script>

var zm=document.getElementById("zmute");
if(zm){zm.addEventListener("click",function(){zm.textContent=Z.mute()?"Som desligado":"Som ligado"})}

var G = (function(){

    var r = cnv.getBoundingClientRect();
    var px = (ev.touches && ev.touches[0]) ? ev.touches[0].clientX : ev.clientX;
    var py = (ev.touches && ev.touches[0]) ? ev.touches[0].clientY : ev.clientY;
    return {
      x: (px - r.left) * (cnv.width / (r.width || cnv.width)),
      y: (py - r.top) * (cnv.height / (r.height || cnv.height))
    };
  }

  function loop(fn){
    var alive = true, last = 0, id = 0;
    function tick(t){
      if(!alive) return;
      var dt = last ? Math.min(3, (t - last) / 16.6667) : 1;
      last = t;
      try { fn(dt); } catch(e){ alive = false; return; }
      id = requestAnimationFrame(tick);
    }
    if(typeof requestAnimationFrame === "function") id = requestAnimationFrame(tick);
    return { stop: function(){ alive = false; try{ cancelAnimationFrame(id); }catch(e){} } };
  }

  function txt(id, v){ var e = document.getElementById(id); if(e) e.textContent = v; }

  function emoji(x, e, s, px, py){
    if(!x) return;
    x.save();
    x.font = s + "px system-ui, 'Apple Color Emoji','Segoe UI Emoji', sans-serif";
    x.textAlign = "center"; x.textBaseline = "middle";
    x.fillText(e, px, py);
    x.restore();
  }

  function fundo(x, cnv, cor){
    if(!x) return;
    x.fillStyle = cor || "#fbfaf7";
    x.fillRect(0, 0, cnv.width, cnv.height);
  }

  function over(titulo, msg, rotulo, cb){
    var old = document.getElementById("zover");
    if(old) old.remove();
    var d = document.createElement("div");
    d.className = "zmodal"; d.id = "zover";
    d.innerHTML = '<div class="zbox"><h3></h3><p></p><button class="zbtn big" type="button"></button></div>';
    d.querySelector("h3").textContent = titulo;
    d.querySelector("p").textContent = msg;
    var b = d.querySelector("button");
    b.textContent = rotulo || "Jogar de novo";
    b.addEventListener("click", function(){ d.remove(); if(cb) cb(); });
    document.body.appendChild(d);
    try { b.focus(); } catch(e){}
  }

  function best(chave, valor, maior){
    var atual = Z.store.get("rec:" + chave, null);
    var novo = false;
    if(atual === null || (maior !== false ? valor > atual : valor < atual)){
      Z.store.set("rec:" + chave, valor); atual = valor; novo = true;
    }
    return { valor: atual, novo: novo };
  }

  function clamp(v, a, b){ return v < a ? a : (v > b ? b : v); }
  function rnd(a, b){ return a + Math.random() * (b - a); }
  function ri(a, b){ return Math.floor(a + Math.random() * (b - a + 1)); }
  function pick(a){ return a[Math.floor(Math.random() * a.length)]; }
  function shuffle(a){
    var r = a.slice();
    for(var i = r.length - 1; i > 0; i--){ var j = Math.floor(Math.random() * (i + 1)); var t = r[i]; r[i] = r[j]; r[j] = t; }
    return r;
  }

  bindPad();
  return { ctx2d:ctx2d, keys:keys, pos:pos, loop:loop, txt:txt, emoji:emoji, fundo:fundo,
           over:over, best:best, clamp:clamp, rnd:rnd, ri:ri, pick:pick, shuffle:shuffle };
})();


var T = {"heroi":"🪞","inimigo":"🌀","tiro":"•","ceu":"#f4f3ef"};
var C = G.ctx2d("cv"), cnv = C.c, x = C.x, W = cnv.width, H = cnv.height;
var px, tiros, ini, pts, vidas, onda, vivo = false, cd = 0, spawn = 0;
G.txt("gRec", Z.store.get("rec:tiro:" + document.body.dataset.app, 0));
function iniciar(){
  px = W/2; tiros = []; ini = []; pts = 0; vidas = 3; onda = 1; vivo = true; cd = 0; spawn = 0;
  G.txt("gPts", 0); G.txt("gVid", 3); G.txt("gOnda", 1);
}
function fim(){
  vivo = false;
  var b = G.best("tiro:" + document.body.dataset.app, pts); G.txt("gRec", b.valor);
  G.over(b.novo ? "Novo recorde!" : "Base destruída", "Pontos: " + pts + " · Ondas: " + onda, "Jogar de novo", iniciar);
}
function atirar(){ if(vivo && cd <= 0){ tiros.push({ x: px, y: H - 54 }); cd = 11; Z.snd(680, .04, "square"); } }
function passo(dt){
  if(!vivo) return;
  cd -= dt;
  if (G.keys.ArrowLeft) px -= 6 * dt;
  if (G.keys.ArrowRight) px += 6 * dt;
  if (G.keys[" "] || G.keys.ArrowUp) atirar();
  px = G.clamp(px, 26, W - 26);
  spawn += dt;
  if (spawn > Math.max(18, 55 - onda * 3)){
    spawn = 0;
    ini.push({ x: G.rnd(30, W - 30), y: -18, v: 0.6 + onda * 0.13, hp: 1 + Math.floor(onda / 4) });
  }
  for (var i = tiros.length - 1; i >= 0; i--){
    tiros[i].y -= 8 * dt;
    if (tiros[i].y < -10) tiros.splice(i, 1);
  }
  for (var k = ini.length - 1; k >= 0; k--){
    var e = ini[k]; e.y += e.v * dt;
    for (var b2 = tiros.length - 1; b2 >= 0; b2--){
      if (Math.abs(tiros[b2].x - e.x) < 20 && Math.abs(tiros[b2].y - e.y) < 20){
        tiros.splice(b2, 1); e.hp--;
        if (e.hp <= 0){
          ini.splice(k, 1); pts += 20; G.txt("gPts", pts); Z.snd(900, .06);
          if (pts >= onda * 200){ onda++; G.txt("gOnda", onda); Z.toast("Onda " + onda); }
        }
        break;
      }
    }
    if (e.y > H - 30){ ini.splice(k, 1); vidas--; G.txt("gVid", vidas); Z.snd(160, .2, "sawtooth"); if(vidas <= 0) fim(); }
  }
}
function desenha(){
  if(!x) return;
  G.fundo(x, cnv, T.ceu);
  x.fillStyle = "rgba(159,81,64,.14)"; x.fillRect(0, H - 22, W, 22);
  x.fillStyle = "#252422";
  for (var i = 0; i < tiros.length; i++){ x.beginPath(); x.arc(tiros[i].x, tiros[i].y, 4, 0, 6.3); x.fill(); }
  for (var k = 0; k < ini.length; k++) G.emoji(x, T.inimigo, 28, ini[k].x, ini[k].y);
  G.emoji(x, T.heroi, 32, px, H - 38);
}
iniciar(); vivo = false; desenha();
G.loop(function(dt){ passo(dt); desenha(); });
cnv.addEventListener("pointerdown", function(e){ e.preventDefault(); px = G.pos(cnv, e).x; atirar(); });
document.getElementById("gStart").addEventListener("click", iniciar);

</script>
