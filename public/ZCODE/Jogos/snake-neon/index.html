<!doctype html>
<html lang="pt-BR" data-cat="jogos">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Snake Neon — Zcode</title>
<meta name="description" content="O clássico da cobrinha em neon. Coma e cresça!">
<meta name="theme-color" content="#05070f">
<meta name="application-name" content="Zcode">
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D'http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg'%20viewBox%3D'0%200%2064%2064'%3E%3Cdefs%3E%3ClinearGradient%20id%3D'g'%20x1%3D'0'%20y1%3D'0'%20x2%3D'1'%20y2%3D'1'%3E%3Cstop%20offset%3D'0'%20stop-color%3D'%237c5cff'%2F%3E%3Cstop%20offset%3D'1'%20stop-color%3D'%2329e0ff'%2F%3E%3C%2FlinearGradient%3E%3C%2Fdefs%3E%3Crect%20width%3D'64'%20height%3D'64'%20rx%3D'14'%20fill%3D'url(%23g)'%2F%3E%3Cpath%20d%3D'M20%2018h24L20%2046h24'%20fill%3D'none'%20stroke%3D'white'%20stroke-width%3D'8'%20stroke-linecap%3D'round'%20stroke-linejoin%3D'round'%2F%3E%3C%2Fsvg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --z-bg:#05070f; --z-bg2:#0a0d1a; --z-surface:#0e1322; --z-surface2:#151c33;
  --z-line:rgba(148,158,210,.14); --z-line2:rgba(148,158,210,.28);
  --z-text:#edf0ff; --z-muted:#97a0c4;
  --z-brand:#7c5cff; --z-brand-soft:rgba(124,92,255,.16);
  --z-cyan:#29e0ff; --z-pink:#ff4d8f; --z-lime:#7dff6a; --z-amber:#ffb347;
  --z-red:#ff5c5c; --z-radius:18px;
  --z-fd:"Space Grotesk",system-ui,sans-serif;
  --z-f:"Inter",system-ui,sans-serif;
  --z-fm:"JetBrains Mono",ui-monospace,monospace;
  --z-acc:var(--z-brand);
}
html[data-cat="estudos"]{--z-acc:var(--z-cyan)}
html[data-cat="jogos"]{--z-acc:var(--z-pink)}
html[data-cat="uteis"]{--z-acc:var(--z-lime)}
html[data-cat="social"]{--z-acc:var(--z-amber)}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{
  background:
    radial-gradient(1100px 500px at 85% -10%, rgba(124,92,255,.14), transparent 60%),
    radial-gradient(900px 420px at -10% 110%, rgba(41,224,255,.08), transparent 60%),
    var(--z-bg);
  color:var(--z-text); font-family:var(--z-f); font-size:15px; line-height:1.55;
  min-height:100dvh; -webkit-font-smoothing:antialiased;
}
::selection{background:var(--z-acc);color:#04060d}
a{color:var(--z-acc)}
h1,h2,h3,.fd{font-family:var(--z-fd);letter-spacing:-.02em}
.mono{font-family:var(--z-fm)}
.dim{color:var(--z-muted)} .acc{color:var(--z-acc)}
.center{text-align:center} .row{display:flex;gap:10px;align-items:center}
.wrap{flex-wrap:wrap} .between{justify-content:space-between}
.col{display:flex;flex-direction:column;gap:10px}
.mt{margin-top:14px} .mb{margin-bottom:14px} .grow{flex:1}
.hidden{display:none!important}

/* ── topo ─────────────────────────────────────────────── */
.ztop{
  position:sticky;top:0;z-index:50;display:flex;align-items:center;gap:12px;
  height:54px;padding:0 16px;border-bottom:1px solid var(--z-line);
  background:rgba(5,7,15,.78);backdrop-filter:blur(14px);
}
.zlogo{display:grid;place-items:center;width:34px;height:34px;border-radius:10px;
  background:linear-gradient(135deg,#7c5cff,#29e0ff);color:#fff;
  font-family:var(--z-fd);font-weight:700;font-size:19px;text-decoration:none;
  box-shadow:0 6px 18px -6px rgba(124,92,255,.65);flex:none}
.ztop-mid{min-width:0}
.ztop-mid strong{display:block;font-family:var(--z-fd);font-size:14.5px;letter-spacing:-.01em;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.zchip{display:inline-flex;align-items:center;gap:6px;font-family:var(--z-fm);font-size:10px;
  letter-spacing:.14em;text-transform:uppercase;color:var(--z-acc);
  background:color-mix(in srgb,var(--z-acc) 12%, transparent);
  border:1px solid color-mix(in srgb,var(--z-acc) 34%, transparent);
  padding:2px 9px;border-radius:99px;white-space:nowrap}
.zback{margin-left:auto;font-family:var(--z-fm);font-size:11.5px;text-decoration:none;
  color:var(--z-muted);border:1px solid var(--z-line2);border-radius:99px;padding:7px 13px;
  transition:.2s;white-space:nowrap}
.zback:hover{color:var(--z-text);border-color:var(--z-acc)}

/* ── layout ───────────────────────────────────────────── */
.zmain{max-width:980px;margin:0 auto;padding:26px 16px 70px}
.zhero{margin-bottom:22px}
.zhero h1{font-size:clamp(26px,4.5vw,40px);font-weight:700;line-height:1.05}
.zhero h1 em{font-style:normal;color:var(--z-acc)}
.zhero p{color:var(--z-muted);margin-top:8px;max-width:640px}
.zfoot{border-top:1px solid var(--z-line);padding:18px 16px 26px;text-align:center;
  font-family:var(--z-fm);font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--z-muted)}
.zfoot b{color:var(--z-text);font-weight:600}

/* ── cartões / painéis ────────────────────────────────── */
.zcard{background:var(--z-surface);border:1px solid var(--z-line);
  border-radius:var(--z-radius);padding:18px}
.zcard.pad{padding:24px}
.zgrid{display:grid;gap:12px}
.zg2{grid-template-columns:repeat(2,1fr)}
.zg3{grid-template-columns:repeat(3,1fr)}
.zg4{grid-template-columns:repeat(4,1fr)}
.zbig{font-family:var(--z-fd);font-size:clamp(40px,9vw,72px);font-weight:700;line-height:1;
  font-variant-numeric:tabular-nums}
.zstat{display:flex;flex-direction:column;gap:2px}
.zstat span{font-family:var(--z-fm);font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--z-muted)}
.zstat b{font-family:var(--z-fd);font-size:20px;font-weight:700}

/* ── botões / campos ──────────────────────────────────── */
.zbtn{display:inline-flex;align-items:center;justify-content:center;gap:8px;cursor:pointer;
  font-family:var(--z-fd);font-weight:600;font-size:14.5px;letter-spacing:-.01em;
  color:#04060d;background:var(--z-acc);border:1px solid transparent;border-radius:13px;
  padding:11px 20px;transition:.18s;text-decoration:none;user-select:none}
.zbtn:hover{filter:brightness(1.12);transform:translateY(-1px)}
.zbtn:active{transform:translateY(0)}
.zbtn:disabled{opacity:.45;cursor:not-allowed;transform:none;filter:none}
.zbtn.ghost{background:transparent;color:var(--z-text);border-color:var(--z-line2)}
.zbtn.ghost:hover{border-color:var(--z-acc);color:var(--z-acc)}
.zbtn.danger{background:var(--z-red);color:#fff}
.zbtn.sm{padding:7px 13px;font-size:12.5px;border-radius:10px}
.zbtn.big{padding:14px 28px;font-size:16px;border-radius:15px}
.zbtn.w{width:100%}
.zinput,.zselect,.ztextarea{width:100%;background:var(--z-surface2);border:1px solid var(--z-line2);
  color:var(--z-text);border-radius:12px;padding:11px 14px;font-family:var(--z-f);font-size:15px;
  outline:none;transition:.18s}
.zinput:focus,.zselect:focus,.ztextarea:focus{border-color:var(--z-acc);box-shadow:0 0 0 3px color-mix(in srgb,var(--z-acc) 22%,transparent)}
.ztextarea{min-height:130px;resize:vertical;font-family:var(--z-fm);font-size:13px;line-height:1.5}
.zselect{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--z-muted) 50%),linear-gradient(135deg,var(--z-muted) 50%,transparent 50%);
  background-position:calc(100% - 18px) 55%,calc(100% - 13px) 55%;background-size:5px 5px;background-repeat:no-repeat;padding-right:38px}
.zlabel{display:block;font-family:var(--z-fm);font-size:10.5px;letter-spacing:.16em;
  text-transform:uppercase;color:var(--z-muted);margin-bottom:6px}

/* ── opções (quiz) ────────────────────────────────────── */
.zopty{display:flex;align-items:center;gap:12px;width:100%;text-align:left;cursor:pointer;
  background:var(--z-surface2);color:var(--z-text);border:1px solid var(--z-line2);
  border-radius:14px;padding:13px 16px;font-family:var(--z-f);font-size:15px;transition:.16s}
.zopty:hover:not(:disabled){border-color:var(--z-acc);transform:translateX(3px)}
.zopty i{font-style:normal;font-family:var(--z-fm);font-size:11px;color:var(--z-muted);
  width:24px;height:24px;border-radius:8px;display:grid;place-items:center;
  background:rgba(148,158,210,.1);flex:none}
.zopty.ok{border-color:var(--z-lime);background:color-mix(in srgb,var(--z-lime) 14%, var(--z-surface2));color:var(--z-lime)}
.zopty.err{border-color:var(--z-red);background:color-mix(in srgb,var(--z-red) 14%, var(--z-surface2));color:var(--z-red)}
.zopty:disabled{cursor:default}

/* ── barra / progresso / toast / modal ────────────────── */
.zprog{height:8px;border-radius:99px;background:var(--z-surface2);overflow:hidden}
.zprog i{display:block;height:100%;border-radius:99px;background:var(--z-acc);transition:width .3s}
.ztoast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,16px);z-index:99;
  background:var(--z-text);color:#04060d;font-weight:600;font-size:13.5px;padding:10px 20px;
  border-radius:99px;opacity:0;pointer-events:none;transition:.25s;box-shadow:0 14px 34px -10px rgba(0,0,0,.6)}
.ztoast.on{opacity:1;transform:translate(-50%,0)}
.zmodal{position:fixed;inset:0;z-index:80;display:grid;place-items:center;padding:20px;
  background:rgba(3,4,10,.72);backdrop-filter:blur(6px)}
.zbox{width:min(460px,100%);background:var(--z-surface);border:1px solid var(--z-line2);
  border-radius:22px;padding:26px;text-align:center}
.zbox h3{font-size:24px;margin-bottom:8px}
.zbox p{color:var(--z-muted);margin-bottom:18px}
.zkbd{font-family:var(--z-fm);font-size:11px;border:1px solid var(--z-line2);border-bottom-width:2px;
  border-radius:7px;padding:2px 7px;background:var(--z-surface2)}
canvas.zc{display:block;width:100%;border-radius:16px;border:1px solid var(--z-line);
  background:var(--z-bg2);touch-action:none}
@media (max-width:560px){
  .zg3,.zg4{grid-template-columns:repeat(2,1fr)}
  .zmain{padding-top:18px}
}
@media (prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important}
}
</style>
</head>
<body data-app="snake-neon">
<header class="ztop">
  <a class="zlogo" href="/" aria-label="Zcode">Z</a>
  <div class="ztop-mid">
    <strong>Snake Neon</strong>
  </div>
  <span class="zchip">Jogos</span>
  
    <button id="zmute" class="zback" type="button" title="Som" style="margin-left:0">🔊</button>
  <a class="zback" href="/">← Zcode</a>
</header>
<main class="zmain" id="zmain">

<div class="zhero"><h1>Snake Neon</h1><p>O clássico da cobrinha em neon. Coma e cresça!</p></div>

<div class="row mb" style="justify-content:center;gap:8px">
  <span class="zchip" id="score">Pontos: 0</span>
  <span class="zchip" id="best">Recorde: 0</span>
</div>
<div style="position:relative;max-width:440px;margin:0 auto">
  <canvas class="zc" id="cv" width="360" height="360"></canvas>
  <div class="zmodal hidden" id="fim" style="position:absolute;inset:0;border-radius:16px">
    <div class="zbox">
      <h3>Fim de jogo</h3>
      <p>Pontuação: <b class="acc" id="fimScore">0</b></p>
      <button class="zbtn" id="reinicia" type="button">Jogar de novo</button>
    </div>
  </div>
</div>
<p class="dim center mt" style="font-size:12.5px">← ↑ → ↓ ou WASD · no celular, deslize o dedo</p>
</main>
<footer class="zfoot"><b>Zcode</b> · plataforma de aplicativos · Jogos</footer>
<script>

if (typeof CanvasRenderingContext2D !== "undefined" && CanvasRenderingContext2D.prototype && !CanvasRenderingContext2D.prototype.roundRect) {
  CanvasRenderingContext2D.prototype.roundRect = function (x, y, w, h, r) {
    if (typeof r === "number") r = [r, r, r, r];
    if (!r) r = [0, 0, 0, 0];
    this.beginPath();
    this.moveTo(x + r[0], y);
    this.arcTo(x + w, y, x + w, y + h, r[1]);
    this.arcTo(x + w, y + h, x, y + h, r[2]);
    this.arcTo(x, y + h, x, y, r[3]);
    this.arcTo(x, y, x + w, y, r[0]);
    this.closePath();
    return this;
  };
}
window.Z=(function(){
  var $=function(s,r){return (r||document).querySelector(s)};
  var $$=function(s,r){return Array.prototype.slice.call((r||document).querySelectorAll(s))};
  var toastTimer=null;
  function toast(msg,ms){
    var t=$("#ztoast");
    if(!t){t=document.createElement("div");t.id="ztoast";t.className="ztoast";document.body.appendChild(t)}
    t.textContent=msg;t.classList.add("on");
    clearTimeout(toastTimer);
    toastTimer=setTimeout(function(){t.classList.remove("on")},ms||2200);
  }
  var store={
    get:function(k,d){try{var v=localStorage.getItem("zcode:"+k);return v==null?d:JSON.parse(v)}catch(e){return d}},
    set:function(k,v){try{localStorage.setItem("zcode:"+k,JSON.stringify(v))}catch(e){}},
    best:function(k){return store.get("best:"+k,0)},
    setBest:function(k,v){if(v>store.best(k))store.set("best:"+k,v)}
  };
  var actx=null,muted=false;
  function ensureCtx(){
    try{
      var AC=window.AudioContext||window.webkitAudioContext;
      if(!AC)return null;
      if(!actx)actx=new AC();
      if(actx.state==="suspended")actx.resume();
      return actx;
    }catch(e){return null}
  }
  function snd(freq,dur,type,vol){
    if(muted)return;
    var c=ensureCtx();if(!c)return;
    try{
      var o=c.createOscillator(),g=c.createGain();
      o.type=type||"sine";o.frequency.value=freq||520;
      g.gain.value=vol||0.05;
      g.gain.exponentialRampToValueAtTime(0.0001,c.currentTime+(dur||0.09));
      o.connect(g);g.connect(c.destination);
      o.start();o.stop(c.currentTime+(dur||0.09));
    }catch(e){}
  }
  function onKey(map){
    document.addEventListener("keydown",function(e){
      var k=e.key,low=k.length===1?k.toLowerCase():k;
      if(map[k]||map[low]){e.preventDefault();(map[k]||map[low])()}
    });
  }
  function rnd(a,b){return a+Math.floor(Math.random()*(b-a+1))}
  function pick(arr){return arr[Math.floor(Math.random()*arr.length)]}
  function shuffle(arr){
    var a=arr.slice(),i,j,t;
    for(i=a.length-1;i>0;i--){j=Math.floor(Math.random()*(i+1));t=a[i];a[i]=a[j];a[j]=t}
    return a;
  }
  function copy(t){
    toast("Copiado!");
    if(navigator.clipboard&&navigator.clipboard.writeText){
      navigator.clipboard.writeText(t).catch(function(){fallback()});
    }else fallback();
    function fallback(){
      var ta=document.createElement("textarea");ta.value=t;
      document.body.appendChild(ta);ta.select();
      try{document.execCommand("copy")}catch(e){}
      ta.remove();
    }
  }
  function fmt(n,d){
    try{return Number(n).toLocaleString("pt-BR",{minimumFractionDigits:d||0,maximumFractionDigits:d==null?3:(d||0)})}
    catch(e){return String(n)}
  }
  function el(tag,cls,html){
    var e=document.createElement(tag);
    if(cls)e.className=cls;
    if(html!=null)e.innerHTML=html;
    return e;
  }
  return {$:$,$$:$$,toast:toast,store:store,snd:snd,onKey:onKey,rnd:rnd,pick:pick,shuffle:shuffle,copy:copy,fmt:fmt,el:el,
    mute:function(){muted=!muted;return muted}};
})();


var zm=document.getElementById("zmute");
if(zm){zm.addEventListener("click",function(){zm.textContent=Z.mute()?"🔇":"🔊"})}

(function(){
  var cv = document.getElementById("cv");
  var ctx = cv.getContext ? cv.getContext("2d") : null;
  if(!ctx){ cv.outerHTML = "<p class='dim center'>Seu navegador não suporta canvas.</p>"; return; }
  var N = 18, W = 360, C = W / N;
  var cor = "#29e0ff", vel = 140, WRAP = false;
  var snake, dir, filaDir, food, score, over, last, acc, best = Z.store.best("snake-neon", 0);
  document.getElementById("best").textContent = "Recorde: " + best;
  function novo(){
    snake = [{x: 8, y: 9}, {x: 7, y: 9}, {x: 6, y: 9}];
    dir = {x: 1, y: 0}; filaDir = []; score = 0; over = false; last = performance.now(); acc = 0;
    document.getElementById("fim").classList.add("hidden");
    putFood(); atualizaHUD();
    requestAnimationFrame(loop);
  }
  function putFood(){
    do { food = {x: Z.rnd(0, N-1), y: Z.rnd(0, N-1)} }
    while(snake.some(function(s){ return s.x === food.x && s.y === food.y }));
  }
  function atualizaHUD(){ document.getElementById("score").textContent = "Pontos: " + score }
  function turnar(nx, ny){
    var ultimo = filaDir.length ? filaDir[filaDir.length - 1] : dir;
    if(nx === -ultimo.x && ny === -ultimo.y) return;
    if(nx === ultimo.x && ny === ultimo.y) return;
    filaDir.push({x: nx, y: ny});
    if(filaDir.length > 3) filaDir.shift();
  }
  Z.onKey({ArrowUp: function(){ turnar(0,-1) }, ArrowDown: function(){ turnar(0,1) }, ArrowLeft: function(){ turnar(-1,0) }, ArrowRight: function(){ turnar(1,0) },
    w: function(){ turnar(0,-1) }, s: function(){ turnar(0,1) }, a: function(){ turnar(-1,0) }, d: function(){ turnar(1,0) }});
  var tx = null, ty = null;
  cv.addEventListener("touchstart", function(e){ var t = e.touches[0]; tx = t.clientX; ty = t.clientY }, {passive: true});
  cv.addEventListener("touchend", function(e){
    if(tx == null) return;
    var t = e.changedTouches[0], dx = t.clientX - tx, dy = t.clientY - ty;
    if(Math.abs(dx) > Math.abs(dy)) turnar(dx > 0 ? 1 : -1, 0); else turnar(0, dy > 0 ? 1 : -1);
    tx = null;
  }, {passive: true});
  function passo(){
    if(filaDir.length) dir = filaDir.shift();
    var cab = {x: snake[0].x + dir.x, y: snake[0].y + dir.y};
    if(WRAP){ cab.x = (cab.x + N) % N; cab.y = (cab.y + N) % N; }
    else if(cab.x < 0 || cab.y < 0 || cab.x >= N || cab.y >= N) return fim();
    if(snake.some(function(s){ return s.x === cab.x && s.y === cab.y })) return fim();
    snake.unshift(cab);
    if(cab.x === food.x && cab.y === food.y){
      score++; atualizaHUD(); Z.snd(760, 0.06, "sine"); putFood();
    } else snake.pop();
  }
  function fim(){
    over = true;
    Z.snd(140, 0.3, "sawtooth", 0.05);
    if(score > best){ best = score; Z.store.setBest("snake-neon", best); document.getElementById("best").textContent = "Recorde: " + best }
    document.getElementById("fimScore").textContent = score;
    document.getElementById("fim").classList.remove("hidden");
  }
  function desenha(){
    ctx.fillStyle = "#0a0d1a"; ctx.fillRect(0, 0, W, W);
    ctx.fillStyle = "rgba(148,158,210,0.07)";
    for(var x = 0; x < N; x++) for(var y = 0; y < N; y++) ctx.fillRect(x*C + C/2 - 1, y*C + C/2 - 1, 2, 2);
    ctx.fillStyle = "#ff5c5c";
    ctx.beginPath(); ctx.arc(food.x*C + C/2, food.y*C + C/2, C/3, 0, 7); ctx.fill();
    for(var i = snake.length - 1; i >= 0; i--){
      var s = snake[i];
      ctx.fillStyle = i === 0 ? "#ffffff" : cor;
      var p = 2;
      ctx.beginPath();
      ctx.roundRect(s.x*C + p, s.y*C + p, C - 2*p, C - 2*p, 5);
      ctx.fill();
    }
  }
  function loop(ts){
    if(over) return;
    acc += ts - last; last = ts;
    var tick = Math.max(70, vel - Math.floor(score / 5) * 8);
    while(acc >= tick){ acc -= tick; passo(); if(over) return }
    desenha();
    requestAnimationFrame(loop);
  }
  document.getElementById("reinicia").addEventListener("click", novo);
  novo();
})();

</script>
</body>
</html>
