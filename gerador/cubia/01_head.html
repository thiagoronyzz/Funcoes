<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="description" content="Cubia: sandbox voxel de sobrevivência em mundo procedural infinito, com mineração, crafting, construção, mobs e ciclo dia-noite — tudo em um único arquivo HTML." />
<title>Cubia — mundo voxel infinito</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net" />
<link rel="preconnect" href="https://unpkg.com" />
<style>
  /* Paleta derivada do design system do repositório (Funcoes), adaptada para HUD escuro. */
  :root{
    --bg:#0b1120; --surface:#111a2b; --surface-2:#0d1524;
    --panel:rgba(13,20,34,.82); --panel-solid:#141d2f;
    --text:#e8eefc; --muted:#93a4c4; --line:rgba(148,178,232,.22);
    --primary:#4f86ff; --primary-strong:#1d4ed8; --primary-soft:rgba(79,134,255,.16);
    --accent:#2fbf9b; --danger:#f05252; --warn:#f5a524; --ok:#4ade80;
    --radius-lg:18px; --radius-md:12px; --radius-sm:8px;
    --shadow:0 18px 45px rgba(2,6,18,.55);
    --ui:Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    --mono:ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0; overflow:hidden; background:#05080f; color:var(--text);
    font-family:var(--ui); line-height:1.45; -webkit-font-smoothing:antialiased;
    user-select:none; -webkit-user-select:none; touch-action:none;
  }
  canvas{display:block}
  #gl{position:fixed; inset:0; width:100%; height:100%; cursor:crosshair; z-index:1}
  .hidden{display:none !important}
  button{font:inherit; color:inherit}

  /* ---------- HUD ---------- */
  #hud{position:fixed; inset:0; pointer-events:none; z-index:6}
  #crosshair{
    position:absolute; left:50%; top:50%; width:20px; height:20px; transform:translate(-50%,-50%);
    opacity:.9; mix-blend-mode:difference;
  }
  #crosshair:before,#crosshair:after{content:""; position:absolute; background:#fff}
  #crosshair:before{left:9px; top:0; width:2px; height:20px}
  #crosshair:after{left:0; top:9px; width:20px; height:2px}
  #targetLabel{
    position:absolute; left:50%; top:calc(50% + 26px); transform:translateX(-50%);
    font-size:12px; letter-spacing:.02em; color:#dbe7ff; text-shadow:0 1px 3px #000;
    padding:2px 8px; border-radius:999px; background:rgba(6,10,20,.42); white-space:nowrap;
  }
  #targetLabel:empty{display:none}

  .bars{position:absolute; left:50%; transform:translateX(-50%); display:flex; gap:2px}
  #hearts{bottom:112px}
  #hunger{bottom:112px; right:calc(50% - 200px); left:auto; transform:none}
  #armorbar{bottom:132px}
  #breath{bottom:132px; right:calc(50% - 200px); left:auto; transform:none}
  .bars canvas{width:18px; height:18px; image-rendering:pixelated; filter:drop-shadow(0 1px 1px rgba(0,0,0,.65))}
  #xpwrap{position:absolute; left:50%; bottom:98px; transform:translateX(-50%); width:364px; height:10px}
  #xpbar{position:absolute; inset:0; border-radius:3px; background:rgba(4,8,16,.6); overflow:hidden;
    box-shadow:inset 0 0 0 1px rgba(0,0,0,.55)}
  #xpfill{position:absolute; inset:0 auto 0 0; width:0%;
    background:linear-gradient(180deg,#a6ff5c,#43d21a 60%,#1fa00c); box-shadow:0 0 8px rgba(96,255,60,.5)}
  #xplevel{position:absolute; left:50%; top:-14px; transform:translateX(-50%); font:800 13px/1 var(--ui);
    color:#b6ff7a; text-shadow:2px 2px 0 #14310a}

  #hotbar{
    position:absolute; left:50%; bottom:18px; transform:translateX(-50%);
    display:grid; grid-template-columns:repeat(9,48px); gap:3px; padding:5px;
    background:rgba(7,11,20,.62); border:1px solid rgba(148,178,232,.2); border-radius:12px;
    box-shadow:var(--shadow); pointer-events:auto;
  }
  .slot{
    position:relative; width:48px; height:48px; border-radius:7px;
    background:linear-gradient(180deg,rgba(255,255,255,.09),rgba(255,255,255,.02));
    box-shadow:inset 0 0 0 1px rgba(148,178,232,.24);
    display:flex; align-items:center; justify-content:center;
  }
  .slot canvas{width:38px; height:38px; image-rendering:pixelated}
  .slot.sel{box-shadow:inset 0 0 0 2px #fff, 0 0 12px rgba(255,255,255,.35); transform:translateY(-3px)}
  .slot .n{position:absolute; right:3px; bottom:1px; font:700 13px/1 var(--ui); color:#fff;
    text-shadow:1px 1px 0 #000, -1px 1px 0 #000}
  .slot .dur{position:absolute; left:4px; right:4px; bottom:4px; height:3px; background:rgba(0,0,0,.55); border-radius:2px}
  .slot .dur i{display:block; height:100%; border-radius:2px; background:var(--ok)}
  .slot .ench{position:absolute; left:3px; top:2px; font-size:11px; color:#c9a6ff; text-shadow:0 0 6px #7c3aed}
  .slot:hover{background:rgba(79,134,255,.16)}

  /* ---------- textos flutuantes ---------- */
  #toasts{position:absolute; right:16px; top:16px; display:flex; flex-direction:column; gap:8px; align-items:flex-end}
  .toast{
    pointer-events:auto; min-width:230px; max-width:330px; padding:9px 12px; border-radius:12px;
    background:var(--panel); border:1px solid var(--line); box-shadow:var(--shadow);
    backdrop-filter:blur(10px); animation:tin .28s ease-out;
  }
  .toast b{display:block; font-size:11px; letter-spacing:.09em; text-transform:uppercase; color:var(--primary)}
  .toast span{font-size:13px; color:#eaf1ff}
  .toast.bad b{color:var(--warn)}
  @keyframes tin{from{opacity:0; transform:translateX(18px)}to{opacity:1; transform:none}}
  #centerMsg{
    position:absolute; left:50%; top:34%; transform:translateX(-50%); text-align:center;
    font-size:15px; color:#eaf1ff; text-shadow:0 2px 6px #000;
  }
  #actionbar{
    position:absolute; left:50%; bottom:150px; transform:translateX(-50%);
    font-size:14px; color:#eaf1ff; text-shadow:0 2px 5px #000;
  }

  /* ---------- debug F3 ---------- */
  #debug{
    position:absolute; left:12px; top:12px; font:12px/1.6 var(--mono); color:#e9f2ff;
    background:rgba(5,9,17,.55); border:1px solid var(--line); border-radius:10px; padding:8px 11px;
    white-space:pre; max-width:46vw;
  }
  #debug b{color:var(--primary)}

  /* ---------- overlays / painéis ---------- */
  .veil{
    position:fixed; inset:0; z-index:20; display:grid; place-items:center;
    background:radial-gradient(120% 100% at 50% 0%, rgba(20,32,58,.72), rgba(4,7,14,.93));
    backdrop-filter:blur(7px); pointer-events:auto;
  }
  .panel{
    width:min(860px, 94vw); max-height:92vh; overflow:auto; padding:22px 24px;
    background:linear-gradient(180deg,rgba(20,29,47,.97),rgba(11,17,29,.97));
    border:1px solid var(--line); border-radius:var(--radius-lg); box-shadow:var(--shadow);
  }
  .panel--wide{width:min(1040px,96vw)}
  .eyebrow{margin:0 0 6px; color:var(--primary); font-weight:800; font-size:11px; letter-spacing:.12em; text-transform:uppercase}
  .panel h1{margin:0 0 6px; font-size:clamp(1.6rem,4vw,2.3rem); letter-spacing:-.02em}
  .panel h2{margin:18px 0 8px; font-size:1.02rem}
  .panel h3{margin:14px 0 6px; font-size:.9rem; color:#cfe0ff}
  .panel p{margin:0 0 10px; color:var(--muted); font-size:14px}
  .lead{color:#d7e3fb !important; font-size:15px}
  .grid2{display:grid; grid-template-columns:repeat(auto-fit,minmax(232px,1fr)); gap:12px}
  .field{display:flex; flex-direction:column; gap:5px; font-size:12px; color:var(--muted)}
  .field input,.field select{
    background:var(--surface-2); color:var(--text); border:1px solid var(--line);
    border-radius:var(--radius-sm); padding:9px 10px; font-size:14px; outline:none;
  }
  .field input:focus,.field select:focus{border-color:var(--primary); box-shadow:0 0 0 3px var(--primary-soft)}
  .field input[type=range]{padding:0; accent-color:var(--primary)}
  .btn{
    pointer-events:auto; cursor:pointer; border:1px solid var(--line); background:var(--surface);
    padding:10px 16px; border-radius:var(--radius-md); font-weight:650; font-size:14px;
    transition:transform .12s ease, background .16s ease, border-color .16s ease;
  }
  .btn:hover{background:#1b2740; border-color:var(--primary); transform:translateY(-1px)}
  .btn:active{transform:translateY(0) scale(.99)}
  .btn--primary{background:linear-gradient(180deg,#5b8dff,#1d4ed8); border-color:#7aa5ff; color:#fff}
  .btn--primary:hover{background:linear-gradient(180deg,#6f9bff,#2457e6)}
  .btn--ghost{background:transparent}
  .btn--danger{background:rgba(240,82,82,.14); border-color:rgba(240,82,82,.5); color:#ffc9c9}
  .btnrow{display:flex; flex-wrap:wrap; gap:9px; margin-top:14px}
  .kbd{
    display:inline-block; min-width:20px; text-align:center; padding:1px 6px; border-radius:6px;
    background:#1b2740; border:1px solid var(--line); border-bottom-width:2px; font:600 12px/1.6 var(--mono); color:#dbe7ff;
  }
  .keys{display:grid; grid-template-columns:repeat(auto-fit,minmax(196px,1fr)); gap:6px 16px; font-size:13px; color:var(--muted)}
  .keys div{display:flex; justify-content:space-between; gap:10px; border-bottom:1px dashed rgba(148,178,232,.14); padding:3px 0}
  .keys b{color:#eaf1ff; font-weight:600}
  ul.tight{margin:4px 0 0; padding-left:18px; font-size:13px; color:var(--muted)}
  ul.tight li{margin:3px 0}
  .pill{display:inline-flex; align-items:center; gap:6px; padding:3px 9px; border-radius:999px;
    background:var(--primary-soft); color:#cddcff; font-size:11.5px; font-weight:650; letter-spacing:.03em}
  .pill--ok{background:rgba(45,191,155,.16); color:#9ff0dc}
  .pill--off{background:rgba(148,163,184,.14); color:#a9b8d0}
  .cols{display:grid; grid-template-columns:repeat(auto-fit,minmax(250px,1fr)); gap:16px; align-items:start}
  .tabrow{display:flex; gap:6px; margin:4px 0 12px; flex-wrap:wrap}
  .tab{padding:6px 12px; border-radius:999px; border:1px solid var(--line); background:transparent;
    font-size:12.5px; font-weight:650; color:var(--muted); cursor:pointer}
  .tab.on{background:var(--primary-soft); color:#dce8ff; border-color:var(--primary)}

  /* ---------- inventário / bancas ---------- */
  #screenRoot{position:fixed; inset:0; z-index:22; display:grid; place-items:center; pointer-events:none}
  #screenRoot.on{pointer-events:auto}
  .bench{
    background:linear-gradient(180deg,#1b2338,#101827); border:1px solid var(--line);
    border-radius:16px; box-shadow:var(--shadow); padding:16px; display:flex; gap:18px; align-items:center;
  }
  .bench h4{margin:0 0 8px; font-size:12px; letter-spacing:.08em; text-transform:uppercase; color:var(--muted)}
  .g{display:grid; gap:3px}
  .g3{grid-template-columns:repeat(3,48px)}
  .g2{grid-template-columns:repeat(2,48px)}
  .g9{grid-template-columns:repeat(9,48px)}
  .arrow{width:46px; height:30px; position:relative; opacity:.95}
  .arrow:before{content:""; position:absolute; left:0; top:11px; width:30px; height:7px; background:#8ea3c4; border-radius:2px}
  .arrow:after{content:""; position:absolute; left:28px; top:4px; border:11px solid transparent; border-left-color:#8ea3c4}
  .arrow.busy:before{background:linear-gradient(90deg,var(--warn) var(--p,0%),#3a4763 0)}
  .flame{width:20px; height:24px; background-size:contain; background-repeat:no-repeat; background-position:bottom;
    filter:drop-shadow(0 0 6px rgba(245,165,36,.6))}
  #held{position:fixed; z-index:40; width:44px; height:44px; pointer-events:none; transform:translate(-50%,-50%);
    filter:drop-shadow(0 4px 8px rgba(0,0,0,.6))}
  #tooltip{
    position:fixed; z-index:41; pointer-events:none; padding:6px 10px; border-radius:9px; max-width:280px;
    background:rgba(6,10,18,.95); border:1px solid var(--line); font-size:12.5px; box-shadow:var(--shadow);
  }
  #tooltip b{color:#fff} #tooltip i{color:#a9b8d0; font-style:normal; display:block; font-size:11.5px}
  #tooltip em{color:#c9a6ff; font-style:normal; display:block; font-size:11.5px}
  .recipes{display:grid; grid-template-columns:repeat(auto-fill,minmax(48px,1fr)); gap:4px; max-height:230px; overflow:auto;
    padding:6px; background:rgba(6,10,18,.5); border-radius:10px; border:1px solid var(--line)}
  .palette{display:grid; grid-template-columns:repeat(auto-fill,minmax(48px,1fr)); gap:4px; max-height:44vh; overflow:auto;
    padding:8px; background:rgba(6,10,18,.5); border-radius:10px; border:1px solid var(--line)}
  .ench{display:flex; flex-direction:column; gap:8px; width:230px}
  .ench button{text-align:left; padding:8px 10px; border-radius:10px; border:1px solid var(--line);
    background:#16203a; cursor:pointer; font-size:12.5px}
  .ench button:disabled{opacity:.42; cursor:not-allowed}
  .ench button:hover:disabled{background:#16203a; border-color:var(--line); transform:none}
  .ench button:hover{border-color:var(--primary); background:#1b2740}
  .ench small{display:block; color:var(--muted)}
  .death{background:radial-gradient(90% 80% at 50% 40%, rgba(120,20,20,.5), rgba(3,5,10,.95))}
  #flash{position:fixed; inset:0; z-index:8; pointer-events:none; background:rgba(220,40,40,.4); opacity:0; transition:opacity .18s}
  #water{position:fixed; inset:0; z-index:7; pointer-events:none; background:rgba(30,90,190,.3); opacity:0; transition:opacity .3s}
  #vig{position:fixed; inset:0; z-index:6; pointer-events:none;
    background:radial-gradient(105% 78% at 50% 50%, transparent 52%, rgba(2,5,12,.55) 100%)}
  #hurtvig{position:fixed; inset:0; z-index:9; pointer-events:none; opacity:0; transition:opacity .25s;
    background:radial-gradient(100% 70% at 50% 50%, transparent 40%, rgba(190,20,20,.55) 100%)}

  /* boot / erro */
  #boot{position:fixed; inset:0; z-index:60; display:grid; place-items:center; background:#05080f; text-align:center; padding:24px}
  #boot .spin{width:46px; height:46px; margin:0 auto 16px; border-radius:50%;
    border:3px solid rgba(148,178,232,.24); border-top-color:var(--primary); animation:sp 1s linear infinite}
  @keyframes sp{to{transform:rotate(360deg)}}
  #boot p{color:var(--muted); font-size:13px; max-width:520px}
  .foot{margin-top:18px; padding-top:12px; border-top:1px solid var(--line); font-size:12px; color:#7f92b4}
  .foot a{color:var(--primary)}
  @media (max-width:820px){
    #hotbar{grid-template-columns:repeat(9,40px)} .slot{width:40px;height:40px}
    .slot canvas{width:32px;height:32px} .bars canvas{width:15px;height:15px}
    #xpwrap{width:304px} .bench{flex-direction:column; align-items:flex-start}
  }
</style>
</head>
