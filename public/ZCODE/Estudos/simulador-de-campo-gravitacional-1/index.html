<!doctype html><html lang="pt-BR" data-cat="estudos"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Simulador de Campo Gravitacional — Zcode</title><meta name="description" content="Força entre massas."><style>@import url('https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=DM+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400&display=swap');:root{--bg:#0b1a14;--surface:#112d24;--text:#e6f5f0;--accent:#2dd4bf;--line:rgba(45,212,191,.2);}*{box-sizing:border-box;margin:0;padding:0;font-family:'Inter',system-ui,sans-serif;}body{background:#0b1a14;color:var(--text);min-height:100dvh;display:flex;flex-direction:column;align-items:center;padding:40px 20px;}h1{font-family:'Space Grotesk',Georgia,serif;font-size:2.2rem;letter-spacing:-.03em;text-align:center;margin-bottom:6px;}.subtitle{text-align:center;color:#87d6c5;margin-bottom:24px;font-size:1rem;}.sim-box{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:28px;max-width:640px;width:100%;box-shadow:0 20px 60px rgba(0,0,0,.35);}canvas{width:100%;height:240px;background:#0a1812;border-radius:10px;border:1px solid var(--line);}.control{display:flex;gap:10px;align-items:center;margin-top:14px;}label{font-family:'JetBrains Mono',monospace;font-size:.7rem;text-transform:uppercase;color:var(--accent);}input[type=range]{flex:1;}.desc{margin-top:14px;color:#87d6c5;font-size:.85rem;line-height:1.5;}</style></head><body><h1>Simulador de Campo Gravitacional</h1><p class="subtitle">Força entre massas.</p><div class="sim-box"><canvas id="c"></canvas><div class="control"><label for="v">Parâmetro</label><input id="v" type="range" min="1" max="100" value="30" oninput="draw()"></div></div><div class="desc">Simulação científica interativa com Parâmetro ajustável.</div><script>const ctx=document.getElementById('c').getContext('2d');function draw(){const w=document.getElementById('c').width=640,h=240;ctx.fillStyle='#0a1812';ctx.fillRect(0,0,w,h);ctx.strokeStyle='#2dd4bf';ctx.lineWidth=2;ctx.beginPath();for(let x=0;x<w;x+=4){const v=document.getElementById('v').value/100;const y=h/2+Math.sin(x/30)*(60*v+20)*Math.sin(x/10);if(x===0)ctx.moveTo(x,y);else ctx.lineTo(x,y);}ctx.stroke();}draw();</script></body></html>
