<style>
html,body{margin:0;height:100%;background:#090d0b;color:#edf2ef;font-family:'Inter',system-ui,sans-serif}
header{position:sticky;top:0;z-index:9;display:flex;align-items:center;gap:12px;height:58px;padding:0 16px;background:rgba(9,13,11,.92);backdrop-filter:blur(12px);border-bottom:1px solid rgba(255,255,255,0.09)}

.chip{margin-left:auto;font-family:'JetBrains Mono',monospace;font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:#38bdf8;border:1px solid rgba(255,255,255,0.09);padding:3px 10px;border-radius:99px;flex:0 0 auto}
