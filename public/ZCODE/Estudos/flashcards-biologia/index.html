<style>
:root{
  --z-bg:#f3f0ea; --z-bg2:#fbfaf7; --z-surface:#fffefa; --z-surface2:#e9e4dc;
  --z-line:rgba(37,36,34,.16); --z-line2:rgba(37,36,34,.3);
  --z-text:#252422; --z-muted:#746e66;
  --z-brand:#873f32; --z-brand-soft:rgba(135,63,50,.12);
  --z-cyan:#64716f; --z-pink:#9f5140; --z-lime:#8b8b64; --z-amber:#b88b4a;
  --z-red:#9f5140; --z-radius:4px;
  --z-fd:"DM Serif Display",Georgia,serif;
  --z-f:"DM Sans",system-ui,sans-serif;
  --z-fm:"IBM Plex Mono",ui-monospace,monospace;
  --z-acc:var(--z-brand);
}
html[data-cat="estudos"]{--z-acc:var(--z-cyan)}
html[data-cat="jogos"]{--z-acc:var(--z-pink)}
html[data-cat="uteis"]{--z-acc:var(--z-lime)}
html[data-cat="social"]{--z-acc:var(--z-amber)}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{
  background:var(--z-bg);
  color:var(--z-text); font-family:var(--z-f); font-size:15px; line-height:1.55;
  min-height:100dvh; -webkit-font-smoothing:antialiased;
}
::selection{background:var(--z-acc);color:#04060d}
a{color:var(--z-acc)}
h1,h2,h3,.fd{font-family:var(--z-fd);letter-spacing:-.02em}
.mono{font-family:var(--z-fm)}
.dim{color:var(--z-muted)} .acc{color:var(--z-acc)}
.center{text-align:center} .row{display:flex;gap:10px;align-items:center}
.wrap{flex-wrap:wrap} .between{justify-content:space-between}
.col{display:flex;flex-direction:column;gap:10px}
.mt{margin-top:14px} .mb{margin-bottom:14px} .grow{flex:1}
.hidden{display:none!important}

/* ── topo ─────────────────────────────────────────────── */
.ztop{
  position:sticky;top:0;z-index:50;display:flex;align-items:center;gap:12px;
  height:54px;padding:0 16px;border-bottom:1px solid var(--z-line);
  background:rgba(243,240,234,.96);backdrop-filter:blur(8px);
}
.ztop-brand{color:var(--z-text);font-family:var(--z-fd);font-size:21px;line-height:1;text-decoration:none;letter-spacing:-.04em;flex:none}
.ztop-mid{min-width:0}
.ztop-mid strong{display:block;font-family:var(--z-fd);font-size:14.5px;letter-spacing:-.01em;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.zchip{display:inline-flex;align-items:center;gap:6px;font-family:var(--z-fm);font-size:10px;
  letter-spacing:.14em;text-transform:uppercase;color:var(--z-acc);
  background:color-mix(in srgb,var(--z-acc) 12%, transparent);
  border:1px solid color-mix(in srgb,var(--z-acc) 34%, transparent);
  padding:2px 9px;border-radius:var(--z-radius);white-space:nowrap}
.zback{margin-left:auto;font-family:var(--z-fm);font-size:11.5px;text-decoration:none;
  color:var(--z-muted);border:1px solid var(--z-line2);border-radius:var(--z-radius);padding:7px 13px;
  transition:.2s;white-space:nowrap}
.zback:hover{color:var(--z-text);border-color:var(--z-acc)}

/* ── layout ───────────────────────────────────────────── */
.zmain{max-width:980px;margin:0 auto;padding:26px 16px 70px}
.zhero{margin-bottom:22px}
.zhero h1{font-size:clamp(26px,4.5vw,40px);font-weight:700;line-height:1.05}
.zhero h1 em{font-style:normal;color:var(--z-acc)}
.zhero p{color:var(--z-muted);margin-top:8px;max-width:640px}
.zfoot{border-top:1px solid var(--z-line);padding:18px 16px 26px;text-align:center;
  font-family:var(--z-fm);font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--z-muted)}
.zfoot b{color:var(--z-text);font-weight:600}

/* ── cartões / painéis ────────────────────────────────── */
.zcard{background:var(--z-surface);border:1px solid var(--z-line);
  border-radius:var(--z-radius);padding:18px}
.zcard.pad{padding:24px}
.zgrid{display:grid;gap:12px}
.zg2{grid-template-columns:repeat(2,1fr)}
.zg3{grid-template-columns:repeat(3,1fr)}
.zg4{grid-template-columns:repeat(4,1fr)}
.zbig{font-family:var(--z-fd);font-size:clamp(40px,9vw,72px);font-weight:700;line-height:1;
  font-variant-numeric:tabular-nums}
.zstat{display:flex;flex-direction:column;gap:2px}
.zstat span{font-family:var(--z-fm);font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--z-muted)}
.zstat b{font-family:var(--z-fd);font-size:20px;font-weight:700}

/* ── botões / campos ──────────────────────────────────── */
.zbtn{display:inline-flex;align-items:center;justify-content:center;gap:8px;cursor:pointer;
  font-family:var(--z-fd);font-weight:600;font-size:14.5px;letter-spacing:-.01em;
  color:#04060d;background:var(--z-acc);border:1px solid transparent;border-radius:var(--z-radius);
  padding:11px 20px;transition:.18s;text-decoration:none;user-select:none}
.zbtn:hover{filter:brightness(1.12);transform:translateY(-1px)}
.zbtn:active{transform:translateY(0)}
.zbtn:disabled{opacity:.45;cursor:not-allowed;transform:none;filter:none}
.zbtn.ghost{background:transparent;color:var(--z-text);border-color:var(--z-line2)}
.zbtn.ghost:hover{border-color:var(--z-acc);color:var(--z-acc)}
.zbtn.danger{background:var(--z-red);color:#fff}
.zbtn.sm{padding:7px 13px;font-size:12.5px;border-radius:10px}
.zbtn.big{padding:14px 28px;font-size:16px;border-radius:15px}
.zbtn.w{width:100%}
.zinput,.zselect,.ztextarea{width:100%;background:var(--z-surface2);border:1px solid var(--z-line2);
  color:var(--z-text);border-radius:var(--z-radius);padding:11px 14px;font-family:var(--z-f);font-size:15px;
  outline:none;transition:.18s}
.zinput:focus,.zselect:focus,.ztextarea:focus{border-color:var(--z-acc);box-shadow:0 0 0 3px color-mix(in srgb,var(--z-acc) 22%,transparent)}
.ztextarea{min-height:130px;resize:vertical;font-family:var(--z-fm);font-size:13px;line-height:1.5}
.zselect{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--z-muted) 50%),linear-gradient(135deg,var(--z-muted) 50%,transparent 50%);
  background-position:calc(100% - 18px) 55%,calc(100% - 13px) 55%;background-size:5px 5px;background-repeat:no-repeat;padding-right:38px}
.zlabel{display:block;font-family:var(--z-fm);font-size:10.5px;letter-spacing:.16em;
  text-transform:uppercase;color:var(--z-muted);margin-bottom:6px}

/* ── opções (quiz) ────────────────────────────────────── */
.zopty{display:flex;align-items:center;gap:12px;width:100%;text-align:left;cursor:pointer;
  background:var(--z-surface2);color:var(--z-text);border:1px solid var(--z-line2);
  border-radius:var(--z-radius);padding:13px 16px;font-family:var(--z-f);font-size:15px;transition:.16s}
.zopty:hover:not(:disabled){border-color:var(--z-acc);transform:translateX(3px)}
.zopty i{font-style:normal;font-family:var(--z-fm);font-size:11px;color:var(--z-muted);
  width:24px;height:24px;border-radius:8px;display:grid;place-items:center;
  background:rgba(148,158,210,.1);flex:none}
.zopty.ok{border-color:var(--z-lime);background:color-mix(in srgb,var(--z-lime) 14%, var(--z-surface2));color:var(--z-lime)}
.zopty.err{border-color:var(--z-red);background:color-mix(in srgb,var(--z-red) 14%, var(--z-surface2));color:var(--z-red)}
.zopty:disabled{cursor:default}

/* ── barra / progresso / toast / modal ────────────────── */
.zprog{height:8px;border-radius:var(--z-radius);background:var(--z-surface2);overflow:hidden}
.zprog i{display:block;height:100%;border-radius:99px;background:var(--z-acc);transition:width .3s}
.ztoast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,16px);z-index:99;
  background:var(--z-text);color:#04060d;font-weight:600;font-size:13.5px;padding:10px 20px;
  border-radius:var(--z-radius);opacity:0;pointer-events:none;transition:.25s;box-shadow:0 14px 34px -10px rgba(0,0,0,.6)}
.ztoast.on{opacity:1;transform:translate(-50%,0)}
.zmodal{position:fixed;inset:0;z-index:80;display:grid;place-items:center;padding:20px;
  background:rgba(3,4,10,.72);backdrop-filter:blur(6px)}
.zbox{width:min(460px,100%);background:var(--z-surface);border:1px solid var(--z-line2);
  border-radius:var(--z-radius);padding:26px;text-align:center}
.zbox h3{font-size:24px;margin-bottom:8px}
.zbox p{color:var(--z-muted);margin-bottom:18px}
.zkbd{font-family:var(--z-fm);font-size:11px;border:1px solid var(--z-line2);border-bottom-width:2px;
  border-radius:7px;padding:2px 7px;background:var(--z-surface2)}
canvas.zc{display:block;width:100%;border-radius:16px;border:1px solid var(--z-line);
  background:var(--z-bg2);touch-action:none}
@media (max-width:560px){
  .zg3,.zg4{grid-template-columns:repeat(2,1fr)}
  .zmain{padding-top:18px}
}
@media (prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important}
}
</style>
</head>
<body data-app="flashcards-biologia">
<header class="ztop">
  <a class="ztop-brand" href="/" aria-label="Zcode">Zcode</a>
  <div class="ztop-mid">
    <strong>Flashcards: Biologia</strong>
  </div>
  <span class="zchip">Estudos</span>
  
    <button id="zmute" class="zback" type="button" title="Som" style="margin-left:0">Som ligado</button>
  <a class="zback" href="/">← Zcode</a>
</header>
<main class="zmain" id="zmain">

<div class="zhero">
  <h1>Flashcards: Biologia</h1>
  <p>Estude no modo cartões ou desafie-se no modo teste. 12 cartões.</p>
</div>
<div class="row mb" style="justify-content:center">
  <button class="zbtn sm" id="modo-estudo" type="button">Leitura Estudo</button>
  <button class="zbtn sm ghost" id="modo-teste" type="button">Energia Teste</button>
  <button class="zbtn sm ghost" id="embaralhar" type="button">Ordem</button>
</div>
<div class="col" id="area" style="max-width:560px;margin:0 auto"></div>
<div class="row mt center" style="justify-content:center;gap:14px">
  <button class="zbtn ghost sm" id="prev" type="button">← Anterior</button>
  <span class="zchip" id="pos">1/12</span>
  <button class="zbtn ghost sm" id="next" type="button">Próxima →</button>
</div>
<div class="zcard pad center hidden" id="fim">
  <p class="zchip mb" style="display:inline-flex">Resultado do teste</p>
  <div class="zbig acc" id="fimnum">0%</div>
  <p class="dim mb" id="fimtxt"></p>
  <button class="zbtn" id="reinicia" type="button">Testar de novo</button>
</div>
</main>
<footer class="zfoot"><b>Zcode</b> · plataforma de aplicativos · Estudos</footer>
<script>

if (typeof CanvasRenderingContext2D !== "undefined" && CanvasRenderingContext2D.prototype && !CanvasRenderingContext2D.prototype.roundRect) {
  CanvasRenderingContext2D.prototype.roundRect = function (x, y, w, h, r) {
    if (typeof r === "number") r = [r, r, r, r];
    if (!r) r = [0, 0, 0, 0];
    this.beginPath();
    this.moveTo(x + r[0], y);
    this.arcTo(x + w, y, x + w, y + h, r[1]);
    this.arcTo(x + w, y + h, x, y + h, r[2]);
    this.arcTo(x, y + h, x, y, r[3]);
    this.arcTo(x, y, x + w, y, r[0]);
    this.closePath();
    return this;
  };
}
window.Z=(function(){
  var $=function(s,r){return (r||document).querySelector(s)};
  var $$=function(s,r){return Array.prototype.slice.call((r||document).querySelectorAll(s))};
  var toastTimer=null;
  function toast(msg,ms){
    var t=$("#ztoast");
    if(!t){t=document.createElement("div");t.id="ztoast";t.className="ztoast";document.body.appendChild(t)}
    t.textContent=msg;t.classList.add("on");
    clearTimeout(toastTimer);
    toastTimer=setTimeout(function(){t.classList.remove("on")},ms||2200);
  }
  var store={
    get:function(k,d){try{var v=localStorage.getItem("zcode:"+k);return v==null?d:JSON.parse(v)}catch(e){return d}},
    set:function(k,v){try{localStorage.setItem("zcode:"+k,JSON.stringify(v))}catch(e){}},
    best:function(k){return store.get("best:"+k,0)},
    setBest:function(k,v){if(v>store.best(k))store.set("best:"+k,v)}
  };
  var actx=null,muted=false;
  function ensureCtx(){
    try{
      var AC=window.AudioContext||window.webkitAudioContext;
      if(!AC)return null;
      if(!actx)actx=new AC();
      if(actx.state==="suspended")actx.resume();
      return actx;
    }catch(e){return null}
  }
  function snd(freq,dur,type,vol){
    if(muted)return;
    var c=ensureCtx();if(!c)return;
    try{
      var o=c.createOscillator(),g=c.createGain();
      o.type=type||"sine";o.frequency.value=freq||520;
      g.gain.value=vol||0.05;
      g.gain.exponentialRampToValueAtTime(0.0001,c.currentTime+(dur||0.09));
      o.connect(g);g.connect(c.destination);
      o.start();o.stop(c.currentTime+(dur||0.09));
    }catch(e){}
  }
  function onKey(map){
    document.addEventListener("keydown",function(e){
      var k=e.key,low=k.length===1?k.toLowerCase():k;
      if(map[k]||map[low]){e.preventDefault();(map[k]||map[low])()}
    });
  }
  function rnd(a,b){return a+Math.floor(Math.random()*(b-a+1))}
  function pick(arr){return arr[Math.floor(Math.random()*arr.length)]}
  function shuffle(arr){
    var a=arr.slice(),i,j,t;
    for(i=a.length-1;i>0;i--){j=Math.floor(Math.random()*(i+1));t=a[i];a[i]=a[j];a[j]=t}
    return a;
  }
  function copy(t){
    toast("Copiado!");
    if(navigator.clipboard&&navigator.clipboard.writeText){
      navigator.clipboard.writeText(t).catch(function(){fallback()});
    }else fallback();
    function fallback(){
      var ta=document.createElement("textarea");ta.value=t;
      document.body.appendChild(ta);ta.select();
      try{document.execCommand("copy")}catch(e){}
      ta.remove();
    }
  }
  function fmt(n,d){
    try{return Number(n).toLocaleString("pt-BR",{minimumFractionDigits:d||0,maximumFractionDigits:d==null?3:(d||0)})}
    catch(e){return String(n)}
  }
  function el(tag,cls,html){
    var e=document.createElement(tag);
    if(cls)e.className=cls;
    if(html!=null)e.innerHTML=html;
    return e;
  }
  return {$:$,$$:$$,toast:toast,store:store,snd:snd,onKey:onKey,rnd:rnd,pick:pick,shuffle:shuffle,copy:copy,fmt:fmt,el:el,
    mute:function(){muted=!muted;return muted}};
})();


var zm=document.getElementById("zmute");
if(zm){zm.addEventListener("click",function(){zm.textContent=Z.mute()?"Som desligado":"Som ligado"})}

var DECK = [["Procarionte","Organismo sem núcleo delimitado por membrana (ex.: bactérias)."],["Eucarionte","Organismo com núcleo organizado (ex.: animais, plantas, fungos)."],["Fotossíntese","Processo pelo qual as plantas produzem energia a partir da luz."],["Mitocôndria","Organelo responsável pela respiração celular (energia)."],["Ribossomo","Organelo onde as proteínas são sintetizadas."],["Mitose","Divisão celular que gera duas células idênticas."],["Meiose","Divisão celular que gera células reprodutoras (gametas)."],["Habitat","Espaço onde uma espécie vive naturalmente."],["Cadeia alimentar","Fluxo de energia entre seres vivos (produtores → consumidores)."],["Ecossistema","Conjunto de seres vivos e do ambiente onde vivem."],["Alvéolo","Saco alveolar onde ocorre a troca gasosa nos pulmões."],["Glóbulo vermelho","Célula que transporta oxigênio no sangue."]];
var modo = "estudo", idx = 0, ordem = DECK.map(function(_,i){return i}), flip = false;
var tIdx = 0, tOk = 0, tN = 0;
function $id(x){return document.getElementById(x)}
function deckAtual(){ return ordem.map(function(i){return DECK[i]}) }
function rotulo(){ return $id("pos") }
function renderEstudo(){
  var d = deckAtual(); var c = d[idx % d.length];
  var area = $id("area"); area.innerHTML = "";
  var card = Z.el("div", "");
  card.style.cssText = "position:relative;perspective:1200px;cursor:pointer;height:260px";
  var inner = Z.el("div", "");
  inner.style.cssText = "position:relative;width:100%;height:100%;transition:transform .5s;transform-style:preserve-3d";
  var front = Z.el("div", "zcard pad");
  front.style.cssText = "position:absolute;inset:0;backface-visibility:hidden;display:grid;place-items:center;border:1px solid var(--z-acc);text-align:center";
  front.innerHTML = "<h2 class='fd acc'>? " + c[0] + "</h2><p class='dim' style='margin-top:10px'>toque para virar</p>";
  var back = Z.el("div", "zcard pad");
  back.style.cssText = "position:absolute;inset:0;backface-visibility:hidden;display:grid;place-items:center;transform:rotateY(180deg);text-align:center";
  back.innerHTML = "<p style='font-size:16.5px;line-height:1.5'><b class='acc'>" + c[0] + "</b><br><br>" + c[1] + "</p>";
  inner.appendChild(front); inner.appendChild(back);
  card.appendChild(inner);
  card.addEventListener("click", function(){ flip = !flip; inner.style.transform = flip ? "rotateY(180deg)" : "rotateY(0deg)"; });
  area.appendChild(card);
  rotulo().textContent = (idx % d.length + 1) + "/" + d.length;
}
function renderTeste(){
  var d = deckAtual();
  var p = d[tIdx % d.length];
  var area = $id("area"); area.innerHTML = "";
  var h = Z.el("h3", "fd center");
  h.style.fontSize = "24px"; h.innerHTML = "O que é <span class='acc'>" + p[0] + "</span>?";
  area.appendChild(h);
  var opts = [];
  opts.push(p[1]);
  var outros = Z.shuffle(d.filter(function(x){return x[1] !== p[1]})).slice(0, 3);
  outros.forEach(function(x){ opts.push(x[1]) });
  var certo = 0;
  Z.shuffle(opts).forEach(function(op, i){
    if(op === p[1]) certo = i;
    var b = Z.el("button", "zopty");
    b.innerHTML = "<i>" + ["A","B","C","D"][i] + "</i><span>" + op + "</span>";
    b.addEventListener("click", function(){
      area.querySelectorAll("button").forEach(function(x){ x.disabled = true; });
      if(i === certo){ tOk++; b.classList.add("ok"); Z.snd(840, .08, "sine"); }
      else { b.classList.add("err"); Z.snd(150, .15, "sawtooth", .04); }
      tN++;
      setTimeout(function(){
        tIdx++;
        if(tIdx >= d.length) fimTeste(); else renderTeste();
      }, 700);
    });
    area.appendChild(b);
  });
  rotulo().textContent = (tIdx % d.length + 1) + "/" + d.length;
}
function fimTeste(){
  $id("area").innerHTML = "";
  var pct = Math.round(tOk / tN * 100);
  $id("fim").classList.remove("hidden");
  $id("fimnum").textContent = pct + "%";
  $id("fimtxt").textContent = tOk + " de " + tN + " acertos";
}
function irPara(d, delta){
  if(modo === "estudo"){
    idx = (idx + delta + d.length) % d.length;
    flip = false; renderEstudo();
  } else if(tIdx < d.length){
    tIdx += delta;
    if(tIdx < 0) tIdx = d.length - 1;
    if(tIdx >= d.length) fimTeste(); else renderTeste();
  }
}
$id("modo-estudo").addEventListener("click", function(){
  modo = "estudo"; idx = 0; flip = false;
  $id("modo-estudo").classList.remove("ghost"); $id("modo-teste").classList.add("ghost");
  $id("fim").classList.add("hidden");
  renderEstudo();
});
$id("modo-teste").addEventListener("click", function(){
  modo = "teste"; tIdx = 0; tOk = 0; tN = 0;
  $id("modo-teste").classList.remove("ghost"); $id("modo-estudo").classList.add("ghost");
  $id("fim").classList.add("hidden");
  renderTeste();
});
$id("embaralhar").addEventListener("click", function(){
  ordem = Z.shuffle(ordem);
  Z.toast("Embaralhado!");
  if(modo === "estudo") renderEstudo(); else { tIdx = 0; tOk = 0; tN = 0; renderTeste(); }
});
$id("prev").addEventListener("click", function(){ irPara(deckAtual(), -1) });
