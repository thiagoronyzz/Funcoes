<!doctype html><html lang="pt-BR" data-cat="estudos"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Visualizador de Laplace — Zcode</title><meta name="description" content="Polos e zeros."><style>@import url('https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=DM+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400&display=swap');:root{--bg:#0c0a14;--surface:#1a1128;--text:#f5f0ff;--accent:#c084fc;--line:rgba(192,132,252,.2);}*{box-sizing:border-box;margin:0;padding:0;font-family:'Inter',system-ui,sans-serif;}body{background:#0c0a14;color:var(--text);min-height:100dvh;display:flex;flex-direction:column;align-items:center;padding:40px 20px;}h1{font-family:'Space Grotesk',Georgia,serif;font-size:2rem;letter-spacing:-.03em;text-align:center;margin-bottom:6px;color:#f5f0ff;}.subtitle{text-align:center;color:#c9b8e6;margin-bottom:22px;font-size:1rem;}.viz{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:24px;width:100%;max-width:640px;box-shadow:0 20px 60px rgba(0,0,0,.35);}canvas{width:100%;height:260px;background:#0c0912;border-radius:10px;border:1px solid var(--line);display:block;}.desc{margin-top:12px;color:#c9b8e6;font-size:.85rem;line-height:1.5;}</style></head><body><h1>Visualizador de Laplace</h1><p class="subtitle">Polos e zeros.</p><div class="viz"><canvas id="v"></canvas></div><div class="desc">Visualização: Polos e zeros.</div><script>const c=document.getElementById('v'),ctx=c.getContext('2d');function draw(){c.width=640;c.height=260;ctx.fillStyle='#0c0912';ctx.fillRect(0,0,640,260);ctx.strokeStyle='#c084fc';ctx.lineWidth=2;ctx.beginPath();for(let x=0;x<640;x+=4){const y=130+Math.sin(x/40)*60*Math.sin(x/15);if(x===0)ctx.moveTo(x,y);else ctx.lineTo(x,y);}ctx.stroke();}draw();</script></body></html>
