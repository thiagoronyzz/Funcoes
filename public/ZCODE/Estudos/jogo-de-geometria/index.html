<!doctype html><html lang="pt-BR" data-cat="jogos"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Jogo de Geometria — Zcode</title><meta name="description" content="Construa."><style>@import url('https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=DM+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400&display=swap');:root{--bg:#1a0f2e;--surface:#2d1b4e;--text:#fce7f3;--accent:#e879f9;--line:rgba(232,121,249,.2);}*{box-sizing:border-box;margin:0;padding:0;font-family:'Inter',system-ui,sans-serif;}body{background:#1a0f2e;color:var(--text);min-height:100dvh;display:flex;flex-direction:column;align-items:center;padding:40px 20px;}h1{font-family:'Space Grotesk',Georgia,serif;font-size:2.2rem;letter-spacing:-.03em;text-align:center;margin-bottom:6px;color:#fce7f3;}.subtitle{text-align:center;color:#d8b4e2;margin-bottom:28px;font-size:1rem;}.game-board{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;max-width:400px;width:100%;margin-bottom:20px;}.cell{aspect-ratio:1;background:rgba(255,255,255,.06);border:1px solid var(--line);border-radius:12px;display:flex;align-items:center;justify-content:center;font-family:'JetBrains Mono',monospace;font-size:1.3rem;cursor:pointer;transition:background .2s;}.cell:hover{background:rgba(232,121,249,.15);}.info{text-align:center;color:var(--text);font-family:'Space Grotesk',Georgia,serif;font-size:1.2rem;margin-bottom:12px;}button{padding:12px 24px;background:var(--surface);border:none;border-radius:10px;color:#1a0f2e;font-weight:700;cursor:pointer;}.desc{margin-top:14px;color:#d8b4e2;font-size:.89rem;max-width:480px;text-align:center;line-height:1.5;}</style></head><body><h1>Jogo de Geometria</h1><p class="subtitle">Construa.</p><div class="info">Desafio matemático.</div><div class="game-board" id="board"></div><button onclick="reiniciar()">Reiniciar</button><div class="desc">Desafio matemático.</div><script>let board=[];function init(){board=[];const b=document.getElementById('board');b.innerHTML='';for(let i=0;i<16;i++){board.push(Math.floor(Math.random()*4)+1);const c=document.createElement('div');c.className='cell';c.textContent=board[i];c.onclick=()=>{c.style.background='rgba(232,121,249,.3)';};b.appendChild(c);}}function reiniciar(){init();}init();</script></body></html>
