<!doctype html>
<html lang="pt-BR" data-cat="jogos">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Esquadrão Estelar — Zcode</title>
<meta name="description" content="Shooter espacial com power-ups e chefes a cada 5 ondas.">
<meta name="theme-color" content="#090d0b">
<meta name="application-name" content="Zcode">
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D'http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg'%20viewBox%3D'0%200%2064%2064'%3E%3Crect%20width%3D'64'%20height%3D'64'%20rx%3D'14'%20fill%3D'%230b0f0d'%2F%3E%3Crect%20x%3D'1'%20y%3D'1'%20width%3D'62'%20height%3D'62'%20rx%3D'13'%20fill%3D'none'%20stroke%3D'rgba(255%2C255%2C255%2C0.16)'%20stroke-width%3D'2'%2F%3E%3Cpath%20d%3D'M20%2018h24L20%2046h24'%20fill%3D'none'%20stroke%3D'%2310b981'%20stroke-width%3D'7'%20stroke-linecap%3D'round'%20stroke-linejoin%3D'round'%2F%3E%3C%2Fsvg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Sora:wght@600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --z-bg:#090d0b; --z-bg2:#0c1210; --z-surface:#101715; --z-surface2:#162019;
  --z-line:rgba(255,255,255,.09); --z-line2:rgba(255,255,255,.17);
  --z-text:#edf2ef; --z-muted:#8e9b94;
  --z-brand:#10b981; --z-brand-hi:#34d399; --z-brand-deep:#059669;
  --z-brand-soft:rgba(16,185,129,.12);
  --z-cyan:#38bdf8; --z-pink:#a78bfa; --z-lime:#4ade80; --z-amber:#fbbf24;
  --z-red:#f87171; --z-ok:#34d399; --z-radius:12px;
  --z-fd:"Sora",system-ui,sans-serif;
  --z-f:"Inter",system-ui,sans-serif;
  --z-fm:"JetBrains Mono",ui-monospace,monospace;
  --z-acc:var(--z-brand-hi);
  color-scheme:dark;
}
html[data-cat="estudos"]{--z-acc:var(--z-cyan)}
html[data-cat="jogos"]{--z-acc:var(--z-pink)}
html[data-cat="uteis"]{--z-acc:var(--z-lime)}
html[data-cat="social"]{--z-acc:var(--z-amber)}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{
  background:var(--z-bg);
  background-image:radial-gradient(1100px 340px at 50% -120px,rgba(16,185,129,.09),transparent 70%);
  background-attachment:fixed;
  color:var(--z-text); font-family:var(--z-f); font-size:15px; line-height:1.6;
  min-height:100dvh; -webkit-font-smoothing:antialiased;
}
::selection{background:var(--z-brand);color:#04120c}
a{color:var(--z-brand-hi)}
h1,h2,h3,.fd{font-family:var(--z-fd);letter-spacing:-.02em}
.mono{font-family:var(--z-fm)}
.dim{color:var(--z-muted)} .acc{color:var(--z-acc)}
.center{text-align:center} .row{display:flex;gap:10px;align-items:center}
.wrap{flex-wrap:wrap} .between{justify-content:space-between}
.col{display:flex;flex-direction:column;gap:10px}
.mt{margin-top:14px} .mb{margin-bottom:14px} .grow{flex:1}
.hidden{display:none!important}
:focus-visible{outline:2px solid var(--z-brand-hi);outline-offset:2px;border-radius:6px}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:#243029;border-radius:99px;border:2px solid var(--z-bg)}

/* ── topo ─────────────────────────────────────────────── */
.ztop{
  position:sticky;top:0;z-index:50;display:flex;align-items:center;gap:12px;
  height:58px;padding:0 16px;border-bottom:1px solid var(--z-line);
  background:rgba(9,13,11,.86);backdrop-filter:blur(12px);
}
.ztop-brand{display:inline-flex;align-items:center;gap:9px;color:var(--z-text);
  font-family:var(--z-fd);font-weight:800;font-size:17px;line-height:1;text-decoration:none;flex:none}
.zlogo{display:grid;place-items:center;width:28px;height:28px;border-radius:8px;
  background:linear-gradient(135deg,#10b981,#0d8a63);color:#04120c;font-size:16px;font-weight:800;
  box-shadow:0 4px 14px -4px rgba(16,185,129,.55)}
.ztop-mid{min-width:0}
.ztop-mid strong{display:block;font-size:14px;font-weight:600;letter-spacing:-.01em;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.zchip{display:inline-flex;align-items:center;gap:6px;font-family:var(--z-fm);font-size:10.5px;
  letter-spacing:.12em;text-transform:uppercase;color:var(--z-acc);
  background:color-mix(in srgb,var(--z-acc) 12%, transparent);
  border:1px solid color-mix(in srgb,var(--z-acc) 32%, transparent);
  padding:3px 10px;border-radius:99px;white-space:nowrap}
.zback{margin-left:auto;font-size:13px;font-weight:600;text-decoration:none;
  color:var(--z-muted);border:1px solid var(--z-line2);border-radius:9px;padding:8px 14px;
  transition:.2s;white-space:nowrap;background:transparent;cursor:pointer;font-family:var(--z-f)}
.zback:hover{color:var(--z-text);border-color:var(--z-acc)}

/* ── layout ───────────────────────────────────────────── */
.zmain{max-width:1020px;margin:0 auto;padding:30px 18px 80px}
.zhero{margin-bottom:24px;padding-bottom:20px;border-bottom:1px solid var(--z-line)}
.zhero h1{font-size:clamp(26px,4.5vw,38px);font-weight:800;line-height:1.08;letter-spacing:-.03em}
.zhero h1 em{font-style:normal;color:var(--z-acc)}
.zhero p{color:var(--z-muted);margin-top:8px;max-width:660px;font-size:15.5px}
.zfoot{border-top:1px solid var(--z-line);padding:20px 16px 28px;text-align:center;
  font-family:var(--z-fm);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--z-muted)}
.zfoot b{color:var(--z-text);font-weight:600}

/* ── cartões / painéis ────────────────────────────────── */
.zcard{background:linear-gradient(180deg,rgba(255,255,255,.025),transparent 40%),var(--z-surface);
  border:1px solid var(--z-line);border-radius:var(--z-radius);padding:18px;
  box-shadow:0 18px 40px -28px rgba(0,0,0,.8)}
.zcard.pad{padding:24px}
.zgrid{display:grid;gap:12px}
.zg2{grid-template-columns:repeat(2,1fr)}
.zg3{grid-template-columns:repeat(3,1fr)}
.zg4{grid-template-columns:repeat(4,1fr)}
.zbig{font-family:var(--z-fd);font-size:clamp(40px,9vw,68px);font-weight:800;line-height:1;
  font-variant-numeric:tabular-nums;letter-spacing:-.04em}
.zstat{display:flex;flex-direction:column;gap:2px}
.zstat span{font-family:var(--z-fm);font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--z-muted)}
.zstat b{font-family:var(--z-fd);font-size:20px;font-weight:700}

/* ── tabelas / chamadas / código / selos ──────────────── */
.ztable{width:100%;border-collapse:collapse;font-size:14px}
.ztable th{font-family:var(--z-fm);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--z-muted);font-weight:500;text-align:left;padding:10px 12px;border-bottom:1px solid var(--z-line2)}
.ztable td{padding:11px 12px;border-bottom:1px solid var(--z-line);font-variant-numeric:tabular-nums}
.ztable tr:last-child td{border-bottom:0}
.ztable tr:hover td{background:rgba(255,255,255,.02)}
.zbadge{display:inline-flex;align-items:center;font-size:11.5px;font-weight:700;
  padding:3px 10px;border-radius:99px;background:var(--z-brand-soft);color:var(--z-brand-hi);
  border:1px solid rgba(16,185,129,.3);white-space:nowrap}
.zcallout{border:1px solid var(--z-line2);border-left:3px solid var(--z-acc);
  background:rgba(255,255,255,.025);border-radius:10px;padding:13px 16px;font-size:14px}
.zcallout b{color:var(--z-acc)}
.zcode{font-family:var(--z-fm);font-size:13px;line-height:1.6;background:#070b09;
  border:1px solid var(--z-line);border-radius:10px;padding:14px 16px;overflow-x:auto;white-space:pre}

/* ── botões / campos ──────────────────────────────────── */
.zbtn{display:inline-flex;align-items:center;justify-content:center;gap:8px;cursor:pointer;
  font-family:var(--z-f);font-weight:700;font-size:14.5px;
  color:#04120c;background:var(--z-acc);border:1px solid transparent;border-radius:10px;
  padding:11px 20px;transition:.18s;text-decoration:none;user-select:none}
.zbtn:hover{filter:brightness(1.1);transform:translateY(-1px)}
.zbtn:active{transform:translateY(0)}
.zbtn:disabled{opacity:.4;cursor:not-allowed;transform:none;filter:none}
.zbtn.ghost{background:rgba(255,255,255,.03);color:var(--z-text);border-color:var(--z-line2)}
.zbtn.ghost:hover{border-color:var(--z-acc);color:var(--z-acc)}
.zbtn.danger{background:var(--z-red);color:#1c0606}
.zbtn.sm{padding:7px 13px;font-size:12.5px;border-radius:8px}
.zbtn.big{padding:14px 28px;font-size:16px;border-radius:12px}
.zbtn.w{width:100%}
.zinput,.zselect,.ztextarea{width:100%;background:#0b100d;border:1px solid var(--z-line2);
  color:var(--z-text);border-radius:10px;padding:11px 14px;font-family:var(--z-f);font-size:15px;
  outline:none;transition:.18s}
.zinput:focus,.zselect:focus,.ztextarea:focus{border-color:var(--z-acc);box-shadow:0 0 0 3px color-mix(in srgb,var(--z-acc) 22%,transparent)}
.ztextarea{min-height:130px;resize:vertical;font-family:var(--z-fm);font-size:13px;line-height:1.5}
.zselect{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--z-muted) 50%),linear-gradient(135deg,var(--z-muted) 50%,transparent 50%);
  background-position:calc(100% - 18px) 55%,calc(100% - 13px) 55%;background-size:5px 5px;background-repeat:no-repeat;padding-right:38px}
.zselect option{background:#101715}
.zlabel{display:block;font-family:var(--z-fm);font-size:10.5px;letter-spacing:.14em;
  text-transform:uppercase;color:var(--z-muted);margin-bottom:6px}

/* ── opções (quiz) ────────────────────────────────────── */
.zopty{display:flex;align-items:center;gap:12px;width:100%;text-align:left;cursor:pointer;
  background:rgba(255,255,255,.03);color:var(--z-text);border:1px solid var(--z-line2);
  border-radius:10px;padding:13px 16px;font-family:var(--z-f);font-size:15px;transition:.16s}
.zopty:hover:not(:disabled){border-color:var(--z-acc);transform:translateX(3px)}
.zopty i{font-style:normal;font-family:var(--z-fm);font-size:11px;color:var(--z-muted);
  width:24px;height:24px;border-radius:8px;display:grid;place-items:center;
  background:rgba(255,255,255,.06);flex:none}
.zopty.ok{border-color:var(--z-ok);background:rgba(52,211,153,.1);color:var(--z-ok)}
.zopty.err{border-color:var(--z-red);background:rgba(248,113,113,.1);color:var(--z-red)}
.zopty:disabled{cursor:default}

/* ── barra / progresso / toast / modal ────────────────── */
.zprog{height:8px;border-radius:99px;background:rgba(255,255,255,.07);overflow:hidden}
.zprog i{display:block;height:100%;border-radius:99px;background:var(--z-acc);transition:width .3s}
.ztoast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,16px);z-index:99;
  background:#f2f5f3;color:#0a0e0c;font-weight:700;font-size:13.5px;padding:11px 22px;
  border-radius:10px;opacity:0;pointer-events:none;transition:.25s;box-shadow:0 18px 40px -12px rgba(0,0,0,.7)}
.ztoast.on{opacity:1;transform:translate(-50%,0)}
.zmodal{position:fixed;inset:0;z-index:80;display:grid;place-items:center;padding:20px;
  background:rgba(2,5,4,.72);backdrop-filter:blur(6px)}
.zbox{width:min(460px,100%);background:var(--z-surface);border:1px solid var(--z-line2);
  border-radius:16px;padding:26px;text-align:center;box-shadow:0 30px 60px -20px rgba(0,0,0,.8)}
.zbox h3{font-size:24px;margin-bottom:8px}
.zbox p{color:var(--z-muted);margin-bottom:18px}
.zkbd{font-family:var(--z-fm);font-size:11px;border:1px solid var(--z-line2);border-bottom-width:2px;
  border-radius:7px;padding:2px 7px;background:rgba(255,255,255,.05)}
canvas.zc{display:block;width:100%;border-radius:14px;border:1px solid var(--z-line);
  background:#070b09;touch-action:none}
@media (max-width:560px){
  .zg3,.zg4{grid-template-columns:repeat(2,1fr)}
  .zmain{padding-top:20px}
  .ztop-mid{display:none}
}
@media (prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important}
}
</style>
</head>
<body data-app="esquadrao-estelar">
<header class="ztop">
  <a class="ztop-brand" href="/" aria-label="Zcode — início"><span class="zlogo">Z</span>code</a>
  <div class="ztop-mid">
    <strong>Esquadrão Estelar</strong>
  </div>
  <span class="zchip">Jogos</span>
  
    <button id="zmute" class="zback" type="button" title="Ativar ou desligar o som" style="margin-left:0">Som ligado</button>
  <a class="zback" href="/">← Início</a>
</header>
<main class="zmain" id="zmain">

<div class="zhero"><h1>Esquadrão Estelar</h1><p>Shooter espacial com power-ups e chefes a cada 5 ondas.</p></div>

<div class="row mb wrap" style="justify-content:center">
  <span class="zchip" id="score">Pontos: 0</span>
  <span class="zchip" id="onda">Onda: 1</span>
  <span class="zchip" id="vidas">Vidas: 3</span>
  <span class="zchip" id="best">Recorde: 0</span>
</div>
<div style="position:relative;max-width:400px;margin:0 auto">
  <canvas class="zc" id="cv" width="400" height="520"></canvas>
  
  <div class="zmodal hidden" id="fim" style="position:absolute;inset:0;border-radius:14px">
    <div class="zbox">
      <h3 id="fimTitulo">Fim de jogo</h3>
      <p id="fimTxt"></p>
      <button class="zbtn" id="reinicia" type="button">Jogar de novo</button>
    </div>
  </div>
</div>
<p class="dim center mt" style="font-size:12.5px">Mouse, toque ou setas para mover · tiro automático · sobreviva às ondas</p>
</main>
<footer class="zfoot"><b>Zcode</b> · plataforma de aplicativos · Jogos</footer>
<script>

if (typeof CanvasRenderingContext2D !== "undefined" && CanvasRenderingContext2D.prototype && !CanvasRenderingContext2D.prototype.roundRect) {
  CanvasRenderingContext2D.prototype.roundRect = function (x, y, w, h, r) {
    if (typeof r === "number") r = [r, r, r, r];
    if (!r) r = [0, 0, 0, 0];
    this.beginPath();
    this.moveTo(x + r[0], y);
    this.arcTo(x + w, y, x + w, y + h, r[1]);
    this.arcTo(x + w, y + h, x, y + h, r[2]);
    this.arcTo(x, y + h, x, y, r[3]);
    this.arcTo(x, y, x + w, y, r[0]);
    this.closePath();
    return this;
  };
}
window.Z=(function(){
  var $=function(s,r){return (r||document).querySelector(s)};
  var $$=function(s,r){return Array.prototype.slice.call((r||document).querySelectorAll(s))};
  var toastTimer=null;
  function toast(msg,ms){
    var t=$("#ztoast");
    if(!t){t=document.createElement("div");t.id="ztoast";t.className="ztoast";document.body.appendChild(t)}
    t.textContent=msg;t.classList.add("on");
    clearTimeout(toastTimer);
    toastTimer=setTimeout(function(){t.classList.remove("on")},ms||2200);
  }
  var store={
    get:function(k,d){try{var v=localStorage.getItem("zcode:"+k);return v==null?d:JSON.parse(v)}catch(e){return d}},
    set:function(k,v){try{localStorage.setItem("zcode:"+k,JSON.stringify(v))}catch(e){}},
    best:function(k){return store.get("best:"+k,0)},
    setBest:function(k,v){if(v>store.best(k))store.set("best:"+k,v)}
  };
  var actx=null,muted=false;
  function ensureCtx(){
    try{
      var AC=window.AudioContext||window.webkitAudioContext;
      if(!AC)return null;
      if(!actx)actx=new AC();
      if(actx.state==="suspended")actx.resume();
      return actx;
    }catch(e){return null}
  }
  function snd(freq,dur,type,vol){
    if(muted)return;
    var c=ensureCtx();if(!c)return;
    try{
      var o=c.createOscillator(),g=c.createGain();
      o.type=type||"sine";o.frequency.value=freq||520;
      g.gain.value=vol||0.05;
      g.gain.exponentialRampToValueAtTime(0.0001,c.currentTime+(dur||0.09));
      o.connect(g);g.connect(c.destination);
      o.start();o.stop(c.currentTime+(dur||0.09));
    }catch(e){}
  }
  function onKey(map){
    document.addEventListener("keydown",function(e){
      var k=e.key,low=k.length===1?k.toLowerCase():k;
      if(map[k]||map[low]){e.preventDefault();(map[k]||map[low])()}
    });
  }
  function rnd(a,b){return a+Math.floor(Math.random()*(b-a+1))}
  function pick(arr){return arr[Math.floor(Math.random()*arr.length)]}
  function shuffle(arr){
    var a=arr.slice(),i,j,t;
    for(i=a.length-1;i>0;i--){j=Math.floor(Math.random()*(i+1));t=a[i];a[i]=a[j];a[j]=t}
    return a;
  }
  function copy(t){
    toast("Copiado!");
    if(navigator.clipboard&&navigator.clipboard.writeText){
      navigator.clipboard.writeText(t).catch(function(){fallback()});
    }else fallback();
    function fallback(){
      var ta=document.createElement("textarea");ta.value=t;
      document.body.appendChild(ta);ta.select();
      try{document.execCommand("copy")}catch(e){}
      ta.remove();
    }
  }
  function fmt(n,d){
    try{return Number(n).toLocaleString("pt-BR",{minimumFractionDigits:d||0,maximumFractionDigits:d==null?3:(d||0)})}
    catch(e){return String(n)}
  }
  function el(tag,cls,html){
    var e=document.createElement(tag);
    if(cls)e.className=cls;
    if(html!=null)e.innerHTML=html;
    return e;
  }
  function esc(s){
    return String(s).replace(/[&<>"']/g,function(c){
      return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
    });
  }
  return {$:$,$:$$,toast:toast,store:store,snd:snd,onKey:onKey,rnd:rnd,pick:pick,shuffle:shuffle,copy:copy,fmt:fmt,el:el,esc:esc,
    mute:function(){muted=!muted;return muted}};
})();


var zm=document.getElementById("zmute");
if(zm){zm.addEventListener("click",function(){zm.textContent=Z.mute()?"Som desligado":"Som ligado"})}

(function(){
  var cv=document.getElementById("cv");
  var ctx=cv.getContext?cv.getContext("2d"):null;
  if(!ctx){cv.outerHTML="<p class='dim center'>Seu navegador não suporta canvas.</p>";return;}
  var TURBO=false;
  var W=400,H=520;
  var px,py,balas,tiros,ini,pows,estrelas,score,onda,vidas,over,tiroT,duplo,escudo,inv,chefe,chefeHp,ondaT,spawnT,best,last,esq,dir,cima,baixo;
  var CHAVE="shmup-normal";
  function zera(){
    px=W/2;py=H-70;balas=[];tiros=[];ini=[];pows=[];
    score=0;onda=0;vidas=3;over=false;tiroT=0;duplo=0;escudo=0;inv=0;
    chefe=null;chefeHp=0;ondaT=0;spawnT=0;esq=false;dir=false;cima=false;baixo=false;
    estrelas=[];
    for(var i=0;i<70;i++)estrelas.push({x:Math.random()*W,y:Math.random()*H,v:30+Math.random()*90});
    best=Z.store.best(CHAVE);
    document.getElementById("best").textContent="Recorde: "+best;
    document.getElementById("fim").classList.add("hidden");
    novaOnda();hud();last=performance.now();requestAnimationFrame(loop);
  }
  function novaOnda(){
    onda++;ondaT=0;spawnT=0;
    if(onda%5===0){
      chefe={x:W/2,y:-50,hp:26+onda*4,max:26+onda*4,t:0,tiro:1.4};
      chefeHp=chefe.hp;Z.toast("Chefe se aproxima!");
    }
    hud();
  }
  function hud(){
    document.getElementById("score").textContent="Pontos: "+score;
    document.getElementById("onda").textContent="Onda: "+onda;
    document.getElementById("vidas").textContent="Vidas: "+vidas;
  }
  function fim(){
    over=true;
    if(score>best){best=score;Z.store.setBest(CHAVE,best);}
    document.getElementById("best").textContent="Recorde: "+best;
    Z.snd(140,0.35,"sawtooth",0.05);
    document.getElementById("fimTxt").innerHTML="Pontos: <b class='acc'>"+score+"</b> · Onda <b class='acc'>"+onda+"</b>";
    document.getElementById("fim").classList.remove("hidden");
  }
  function dano(){
    if(inv>0||over)return;
    if(escudo>0){escudo=0;Z.snd(300,0.15,"square",0.05);inv=1;return;}
    vidas--;hud();Z.snd(120,0.3,"sawtooth",0.06);
    if(vidas<=0){fim();return;}
    inv=2;
  }
  function passo(dt){
    var i;
    for(i=0;i<estrelas.length;i++){estrelas[i].y+=estrelas[i].v*dt;if(estrelas[i].y>H){estrelas[i].y=0;estrelas[i].x=Math.random()*W;}}
    var vx=0,vy=0;
    if(esq)vx-=1;if(dir)vx+=1;if(cima)vy-=1;if(baixo)vy+=1;
    px=Math.max(16,Math.min(W-16,px+vx*300*dt));
    py=Math.max(H/2,Math.min(H-30,py+vy*300*dt));
    if(inv>0)inv-=dt;if(duplo>0)duplo-=dt;if(escudo>0)escudo-=dt;
    tiroT-=dt;
    if(tiroT<=0){
      tiroT=duplo>0?0.13:0.2;
      balas.push({x:px,y:py-16,vx:0,vy:-460});
      if(duplo>0){balas.push({x:px-10,y:py-10,vx:-40,vy:-440});balas.push({x:px+10,y:py-10,vx:40,vy:-440});}
    }
    if(!chefe){
      spawnT-=dt;ondaT+=dt;
      if(spawnT<=0&&ondaT<14){
        spawnT=Math.max(0.3,(TURBO?0.7:1.0)-onda*0.04);
        var tipo=Math.random();
        if(tipo<0.45)ini.push({x:30+Math.random()*(W-60),y:-24,t:"reto",hp:1,v:120+onda*6,t:0});
        else if(tipo<0.75)ini.push({x:Math.random()<0.5?30:W-30,y:-24,t:"seno",hp:2,v:100+onda*5,t:0,dir:Math.random()<0.5?1:-1});
        else ini.push({x:60+Math.random()*(W-120),y:-24,t:"tank",hp:5,v:55+onda*3,t:0,tiro:1});
      }
      if(ondaT>=14&&!ini.length&&!tiros.length){novaOnda();return;}
    }
    for(i=balas.length-1;i>=0;i--){
      var b=balas[i];
      b.x+=b.vx*dt;b.y+=b.vy*dt;
      if(b.y<-12){balas.splice(i,1);continue;}
      var acertou=false;
      for(var j=ini.length-1;j>=0;j--){
        var e=ini[j];
        if(Math.abs(b.x-e.x)<16&&Math.abs(b.y-e.y)<16){
          balas.splice(i,1);acertou=true;e.hp--;
          if(e.hp<=0){
            ini.splice(j,1);score+=e.t==="tank"?150:50;hud();
            Z.snd(240,0.07,"sawtooth",0.03);
            if(Math.random()<0.12)pows.push({x:e.x,y:e.y,tipo:["duplo","escudo","vida"][Math.floor(Math.random()*3)],vy:90});
          }
          break;
        }
      }
      if(acertou)continue;
      if(chefe&&Math.abs(b.x-chefe.x)<44&&b.y>chefe.y-24&&b.y<chefe.y+24){
        balas.splice(i,1);chefe.hp--;chefeHp=chefe.hp;
        if(chefe.hp<=0){
          score+=1000;hud();Z.snd(880,0.25,"sine",0.05);
          chefe=null;
          for(var k=0;k<3;k++)pows.push({x:W/2-40+k*40,y:120,tipo:["duplo","escudo","vida"][k],vy:70});
        }
      }
    }
    for(i=ini.length-1;i>=0;i--){
      var e2=ini[i];e2.t+=dt;
      if(e2.t==="seno"){e2.x+=e2.dir*140*dt;e2.y+=e2.v*dt;if(e2.x<20||e2.x>W-20)e2.dir*=-1;}
      else e2.y+=e2.v*dt;
      if(e2.t==="tank"){
        e2.tiro-=dt;
        if(e2.tiro<=0&&e2.y>0&&e2.y<H/2){
          e2.tiro=1.6;
          var a=Math.atan2(py-e2.y,px-e2.x);
          tiros.push({x:e2.x,y:e2.y+10,vx:Math.cos(a)*170,vy:Math.sin(a)*170});
        }
      }
      if(e2.y>H+30){ini.splice(i,1);continue;}
      if(Math.abs(e2.x-px)<24&&Math.abs(e2.y-py)<24){ini.splice(i,1);dano();if(over)return;}
    }
    if(chefe){
      chefe.t+=dt;
      chefe.y=Math.min(110,chefe.y+60*dt);
      chefe.x=W/2+Math.sin(chefe.t*1.2)*(W/2-70);
      chefe.tiro-=dt;
      if(chefe.tiro<=0&&chefe.y>60){
        chefe.tiro=TURBO?0.9:1.3;
        for(var s=0;s<5;s++){
          var aa=Math.PI/2+(s-2)*0.35;
          tiros.push({x:chefe.x,y:chefe.y+20,vx:Math.cos(aa)*190,vy:Math.sin(aa)*190});
        }
        Z.snd(180,0.12,"sawtooth",0.04);
      }
      if(Math.abs(chefe.x-px)<50&&Math.abs(chefe.y-py)<30){dano();if(over)return;}
    }
    for(i=tiros.length-1;i>=0;i--){
      var t=tiros[i];
      t.x+=t.vx*dt;t.y+=t.vy*dt;
      if(t.y>H+12||t.y<-12||t.x<-12||t.x>W+12){tiros.splice(i,1);continue;}
      if(Math.abs(t.x-px)<12&&Math.abs(t.y-py)<12){tiros.splice(i,1);dano();if(over)return;}
    }
    for(i=pows.length-1;i>=0;i--){
      var p=pows[i];
      p.y+=p.vy*dt;
      if(p.y>H+16){pows.splice(i,1);continue;}
      if(Math.abs(p.x-px)<22&&Math.abs(p.y-py)<22){
        if(p.tipo==="duplo"){duplo=12;Z.toast("Tiro duplo!");}
        else if(p.tipo==="escudo"){escudo=12;Z.toast("Escudo ativo!");}
        else{vidas=Math.min(5,vidas+1);hud();Z.toast("+1 vida!");}
        Z.snd(760,0.1,"sine",0.05);
        pows.splice(i,1);
      }
    }
    if(onda%5===0&&chefe===null&&!tiros.length&&!ini.length){
      var espera=(passo._e=(passo._e||0)+dt);
      if(espera>1.2){passo._e=0;novaOnda();}
    } else passo._e=0;
  }
  function desenha(){
    ctx.fillStyle="#05070f";ctx.fillRect(0,0,W,H);
    ctx.fillStyle="rgba(255,255,255,0.5)";
    for(var i=0;i<estrelas.length;i++)ctx.fillRect(estrelas[i].x,estrelas[i].y,2,2);
    for(i=0;i<pows.length;i++){
      var p=pows[i];
      ctx.fillStyle=p.tipo==="duplo"?"#38bdf8":(p.tipo==="escudo"?"#4ade80":"#f87171");
      ctx.beginPath();ctx.roundRect(p.x-10,p.y-10,20,20,6);ctx.fill();
      ctx.fillStyle="#04120c";ctx.font="700 12px Inter,sans-serif";ctx.textAlign="center";
      ctx.fillText(p.tipo==="duplo"?"2":(p.tipo==="escudo"?"E":"+"),p.x,p.y+4);
    }
    for(i=0;i<ini.length;i++){
      var e=ini[i];
      ctx.fillStyle=e.t==="tank"?"#b91c1c":(e.t==="seno"?"#c026d3":"#e11d48");
      ctx.beginPath();
      ctx.moveTo(e.x,e.y+12);ctx.lineTo(e.x-12,e.y-8);ctx.lineTo(e.x+12,e.y-8);
      ctx.closePath();ctx.fill();
    }
    if(chefe){
      ctx.fillStyle="#7f1d1d";
      ctx.beginPath();ctx.roundRect(chefe.x-44,chefe.y-22,88,44,10);ctx.fill();
      ctx.fillStyle="#ef4444";ctx.fillRect(chefe.x-30,chefe.y-6,60,12);
      ctx.fillStyle="#fecaca";ctx.fillRect(chefe.x-6,chefe.y-14,12,8);
      ctx.fillStyle="rgba(0,0,0,0.5)";ctx.fillRect(40,16,W-80,8);
      ctx.fillStyle="#ef4444";ctx.fillRect(40,16,(W-80)*Math.max(chefeHp,0)/chefe.max,8);
    }
    for(i=0;i<tiros.length;i++){
      ctx.fillStyle="#f87171";ctx.beginPath();ctx.arc(tiros[i].x,tiros[i].y,4.5,0,7);ctx.fill();
    }
    for(i=0;i<balas.length;i++){
      ctx.fillStyle="#a7f3d0";ctx.fillRect(balas[i].x-2,balas[i].y-8,4,12);
    }
    if(inv<=0||Math.floor(performance.now()/120)%2===0){
      ctx.fillStyle="#34d399";
      ctx.beginPath();
      ctx.moveTo(px,py-16);ctx.lineTo(px-11,py+10);ctx.lineTo(px,py+4);ctx.lineTo(px+11,py+10);
      ctx.closePath();ctx.fill();
    }
    if(escudo>0){ctx.strokeStyle="rgba(74,222,128,0.8)";ctx.lineWidth=2;ctx.beginPath();ctx.arc(px,py,20,0,7);ctx.stroke();}
  }
  function loop(ts){
    if(over)return;
    var dt=Math.min((ts-last)/1000,0.05);last=ts;
    passo(dt);if(over)return;desenha();
    requestAnimationFrame(loop);
  }
  function movePara(clientX,clientY){
    var r=cv.getBoundingClientRect();
    px=Math.max(16,Math.min(W-16,(clientX-r.left)*(W/r.width)));
    py=Math.max(H/2,Math.min(H-30,(clientY-r.top)*(H/r.height)));
  }
  cv.addEventListener("mousemove",function(e){if(e.buttons)movePara(e.clientX,e.clientY)});
  cv.addEventListener("touchstart",function(e){movePara(e.touches[0].clientX,e.touches[0].clientY)},{passive:true});
  cv.addEventListener("touchmove",function(e){movePara(e.touches[0].clientX,e.touches[0].clientY)},{passive:true});
  document.addEventListener("keydown",function(e){
    if(["ArrowLeft","ArrowRight","ArrowUp","ArrowDown"].indexOf(e.key)>=0)e.preventDefault();
    if(e.key==="ArrowLeft")esq=true;
    if(e.key==="ArrowRight")dir=true;
    if(e.key==="ArrowUp")cima=true;
    if(e.key==="ArrowDown")baixo=true;
  });
  document.addEventListener("keyup",function(e){
    if(e.key==="ArrowLeft")esq=false;
    if(e.key==="ArrowRight")dir=false;
    if(e.key==="ArrowUp")cima=false;
    if(e.key==="ArrowDown")baixo=false;
  });
  document.getElementById("reinicia").addEventListener("click",zera);
  zera();
})();

</script>
